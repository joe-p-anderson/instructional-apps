<!DOCTYPE html>
<!--
  The Activity editor (.scratch/activity-editor/spec.md, "Editor page"). Open it in Chrome or
  Edge from the site (node scripts/static-server.js 4173, then /framework/v1/authoring/activity-editor.html)
  and grant it this repo's folder; elsewhere it reads a chosen folder and Save downloads the file.
  The page is editor/page.js over the DOM-free editor core (editor/core.js) and the folder
  interface (editor/folder.js).
-->
<html lang="en" class="fw-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity editor</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="editor/editor.css">
</head>
<body>
<div class="fw-app" id="app">
  <header class="fw-header">
    <h1 class="fw-title">Activity editor</h1>
    <button type="button" class="ed-act-title" id="act-title" hidden title="Open another Activity (Ctrl+O)"></button>
    <span class="ed-folder" id="folder-status"></span>
    <div class="ed-header-actions" id="actions" hidden>
      <button type="button" class="btn" id="undo" title="Ctrl+Z">Undo</button>
      <button type="button" class="btn" id="redo" title="Ctrl+Shift+Z">Redo</button>
      <span class="ed-status" id="status" role="status" aria-label="Save status"></span>
      <button type="button" class="btn primary" id="save" title="Ctrl+S">Save</button>
    </div>
  </header>
  <section class="ed-screen" id="grant" aria-label="Choose the folder" hidden></section>
  <section class="ed-screen" id="open" aria-label="Open an Activity" hidden></section>
  <div class="ed-main" id="main" hidden>
    <nav class="ed-col ed-outline" id="outline" aria-label="Activity outline"></nav>
    <div class="ed-middle">
      <div class="ed-form" id="form"></div>
      <section class="ed-problems" id="problems" aria-label="Problems"></section>
    </div>
    <aside class="ed-col ed-right" id="right" aria-label="Live Tool"></aside>
  </div>
</div>
<script type="module" src="editor/page.js"></script>
</body>
</html>
