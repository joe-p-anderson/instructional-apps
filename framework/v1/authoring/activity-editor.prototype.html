<!DOCTYPE html>
<!--
  PROTOTYPE (throwaway): a clickable mockup of the Activity editor (.scratch/activity-editor,
  ticket 01). Fake data (a cut-down Phasors and Impedance Activity) and a stand-in for the live
  Tool: no real Tool, folder, runner or save. Not linked from the site's listings.

  Question it answers: does the editor's layout (outline | form + problems | live Tool) give the
  usability the instructor expects, before any real editor UI is built?

  The spec fixes the three-column layout, so the variants (?variant=A|B|C, the bottom bar, or ← →)
  disagree only about the Task form, the densest screen:
    A  Stacked form: every section of the Task in one scrolling column.
    B  Sectioned tabs: the Task split into Prompt / Exposure / Condition / Questions / Hint & notes.
    C  Exposure beside the Tool: the exposure list moves to the right column, under the live Tool.

  Run: node scripts/static-server.js 4173, then open
  http://localhost:4173/framework/v1/authoring/activity-editor.prototype.html
  Delete once the editor page is built to the approved variant.
-->
<html lang="en" class="fw-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOTYPE: Activity editor</title>
<link rel="stylesheet" href="../theme.css">
<style>
  :root { --ed-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
  body { font-size: 15px; }
  .ed-proto-badge { align-self: center; font: 700 11px/1 system-ui, sans-serif; letter-spacing: .08em;
    background: var(--fw-red); color: #fff; padding: 4px 7px; border-radius: 3px; }
  .ed-folder { align-self: center; font-size: 13px; color: var(--fw-text-dim); font-style: italic; white-space: nowrap; }
  .ed-header-actions { margin-left: auto; align-self: center; display: flex; gap: 10px; align-items: center; padding: 6px 0; }
  .ed-header-actions select { font: inherit; font-size: 14px; padding: 2px 4px; background: var(--fw-surface);
    border: 1px solid var(--fw-border-dk); color: var(--fw-text); max-width: 22em; }
  .ed-status { font-size: 13px; color: var(--fw-text-dim); font-style: italic; min-width: 9em; text-align: right; }
  .ed-status.dirty { color: var(--fw-yellow); }
  .ed-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(420px, 1fr) minmax(340px, 430px); }
  .ed-col { min-height: 0; overflow: auto; }
  body[data-variant="C"] .ed-main { grid-template-columns: 230px minmax(420px, 1fr) minmax(380px, 520px); }
  .ed-right td.nowrap { white-space: nowrap; }
  .ed-outline { border-right: 1px solid var(--fw-border); background: var(--fw-surface); padding: 10px 0 70px; }
  .ed-middle { display: flex; flex-direction: column; overflow: hidden; }
  .ed-form { flex: 1; min-height: 0; overflow: auto; padding: 14px 20px 30px; }
  .ed-right { border-left: 1px solid var(--fw-border); background: var(--fw-surface); padding: 12px 14px 80px; }

  /* Outline */
  .ol-item { all: unset; box-sizing: border-box; display: flex; gap: 6px; align-items: baseline; width: 100%;
    padding: 5px 12px; cursor: pointer; font-size: 14px; line-height: 1.3; }
  .ol-item:hover { background: var(--fw-bg); color: var(--fw-blue); }
  .ol-item:focus-visible { outline: 2px solid var(--fw-blue); outline-offset: -2px; }
  .ol-item[aria-current="true"] { background: var(--fw-bg); color: var(--fw-blue); font-weight: bold;
    box-shadow: inset 3px 0 0 var(--fw-blue); }
  .ol-activity { font-weight: bold; font-size: 15px; padding-top: 4px; padding-bottom: 8px; }
  .ol-part { margin-top: 6px; font-weight: bold; }
  .ol-task { padding-left: 26px; }
  .ol-num { color: var(--fw-text-muted); font-size: 12px; min-width: 1.6em; font-weight: normal; }
  .ol-label { flex: 1; }
  .ol-dot { font: 700 11px/1 system-ui, sans-serif; background: var(--fw-red); color: #fff; border-radius: 8px; padding: 2px 5px; }
  .ol-add { all: unset; cursor: pointer; display: block; font-size: 13px; color: var(--fw-blue); padding: 3px 12px 3px 26px; }
  .ol-add:hover { text-decoration: underline; }
  .ol-add.part { padding-left: 12px; margin-top: 10px; }
  .ol-drag { color: var(--fw-text-muted); font-size: 12px; cursor: grab; }

  /* Form */
  .ed-form h2 { font-size: 19px; margin: 0 0 2px; }
  .ed-crumb { font-size: 13px; color: var(--fw-text-dim); font-style: italic; margin-bottom: 12px; }
  .sec { border: 1px solid var(--fw-border); background: var(--fw-surface); border-radius: 4px; margin: 0 0 14px; }
  .sec > h3 { margin: 0; font-size: 14px; letter-spacing: .03em; padding: 7px 12px; border-bottom: 1px solid var(--fw-border);
    background: var(--fw-bg); display: flex; align-items: center; gap: 8px; }
  .sec > h3 .sub { font-weight: normal; font-style: italic; color: var(--fw-text-dim); font-size: 13px; }
  .sec-body { padding: 10px 12px; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .row > label, .flabel { font-size: 13px; color: var(--fw-text-dim); min-width: 5.5em; }
  input.t, textarea.t, select.t { font: inherit; font-size: 14px; padding: 3px 6px; border: 1px solid var(--fw-border-dk);
    background: var(--fw-paper); color: var(--fw-text); border-radius: 2px; }
  input.t:focus, textarea.t:focus, select.t:focus { outline: 2px solid var(--fw-blue); outline-offset: 0; border-color: var(--fw-blue); }
  input.mono, textarea.mono, .mono { font-family: var(--ed-mono); font-size: 13px; }
  input.t.wide { flex: 1; min-width: 10em; }
  input.t.num { width: 6.5em; }
  input.t.expr { width: 15em; }
  textarea.t { width: 100%; resize: vertical; }
  .idfield { display: inline-flex; gap: 6px; align-items: center; }
  .idfield code { font-family: var(--ed-mono); font-size: 13px; background: var(--fw-bg); padding: 2px 6px; border: 1px dashed var(--fw-border-dk); }
  .lnk { all: unset; cursor: pointer; color: var(--fw-blue); font-size: 13px; }
  .lnk:hover { text-decoration: underline; }
  .lnk:focus-visible { outline: 2px solid var(--fw-blue); }
  .lnk.danger { color: var(--fw-red); }
  .btn { font: inherit; font-size: 13px; padding: 2px 9px; border: 1.5px solid var(--fw-blue); color: var(--fw-blue);
    background: transparent; border-radius: 3px; cursor: pointer; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--fw-blue); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--fw-blue); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--fw-blue-dk); }
  .muted { color: var(--fw-text-muted); font-size: 13px; font-style: italic; }
  .live { font-size: 13px; font-family: var(--ed-mono); color: var(--fw-blue); white-space: nowrap; }
  .live.err { color: var(--fw-red); }
  .badge { font: 600 11px/1 system-ui, sans-serif; padding: 3px 6px; border-radius: 3px; white-space: nowrap; letter-spacing: .02em; }
  .badge.here { background: var(--fw-blue); color: #fff; }
  .badge.inh { background: transparent; color: var(--fw-text-muted); border: 1px solid var(--fw-border); }
  .badge.expr { background: #E7EEF7; color: var(--fw-blue-dk); }
  .badge.numb { background: var(--fw-bg); color: var(--fw-text-dim); border: 1px solid var(--fw-border); }
  .flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--fw-orange); } 100% { box-shadow: 0 0 0 3px transparent; } }

  /* Tabs inside the Task form (variant B) */
  .ftabs { display: flex; border-bottom: 2px solid var(--fw-border-dk); margin: 0 0 14px; flex-wrap: wrap; }
  .ftabs .fw-tab { bottom: -2px; }
  .ftab-count { font: 700 11px/1 system-ui, sans-serif; background: var(--fw-red); color: #fff; border-radius: 8px; padding: 2px 5px; margin-left: 5px; }

  /* Prose field */
  .prose { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .prose-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .prose-head .flabel { min-width: 0; }
  .prose textarea { min-height: 6.5em; font-family: var(--ed-mono); font-size: 13px; line-height: 1.45; }
  .prose-out { border: 1px solid var(--fw-border); background: var(--fw-bg); padding: 6px 9px; font-size: 14px; line-height: 1.5;
    min-height: 6.5em; position: relative; overflow-wrap: anywhere; }
  .prose-out::before { content: 'Student sees'; position: absolute; top: -9px; right: 6px; font: 600 10px/1 system-ui, sans-serif;
    background: var(--fw-bg); color: var(--fw-text-muted); padding: 2px 4px; letter-spacing: .05em; }
  .prose.compact { grid-template-columns: 1fr 1fr; }
  .prose.compact textarea, .prose.compact .prose-out { min-height: 2.4em; }
  .info { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px;
    border-radius: 50%; border: 1.5px solid var(--fw-blue); color: var(--fw-blue); font: 700 11px/1 Georgia, serif; cursor: help; }
  .info:focus-visible { outline: 2px solid var(--fw-blue); outline-offset: 2px; }
  .info .tip { display: none; position: absolute; left: 22px; top: -6px; z-index: 30; width: 400px; background: var(--fw-text); color: #fff;
    font: 13px/1.5 system-ui, sans-serif; padding: 9px 11px; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.3); cursor: default; }
  .info:hover .tip, .info:focus .tip, .info:focus-within .tip { display: block; }
  .tip code { font-family: var(--ed-mono); background: rgba(255,255,255,.14); padding: 0 3px; border-radius: 2px; }
  .tip table { border-collapse: collapse; margin: 5px 0; }
  .tip td { padding: 1px 8px 1px 0; vertical-align: top; }

  /* Setup table, exposure list, State readout */
  table.grid { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.grid th { text-align: left; font-size: 12px; color: var(--fw-text-dim); font-weight: normal; font-style: italic;
    padding: 3px 6px; border-bottom: 1px solid var(--fw-border); }
  table.grid td { padding: 4px 6px; border-bottom: 1px solid var(--fw-grid); vertical-align: middle; }
  table.grid tr.bad td { background: #FBEAEA; }
  table.grid tr.grp td { font-size: 12px; color: var(--fw-text-dim); font-style: italic; padding-top: 10px; border-bottom: 1px solid var(--fw-border); }
  .cid { font-family: var(--ed-mono); font-size: 12px; color: var(--fw-text-muted); }
  .seg { display: inline-flex; border: 1.5px solid var(--fw-border-dk); border-radius: 4px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; font-size: 12px; padding: 3px 9px; color: var(--fw-text-dim); border-right: 1px solid var(--fw-border); }
  .seg button:last-child { border-right: none; }
  .seg button:hover { background: var(--fw-bg); color: var(--fw-blue); }
  .seg button:focus-visible { outline: 2px solid var(--fw-blue); outline-offset: -2px; }
  .seg button[aria-pressed="true"] { color: #fff; font-weight: bold; }
  .seg button[aria-pressed="true"][data-v="open"] { background: var(--fw-green); }
  .seg button[aria-pressed="true"][data-v="locked"] { background: var(--fw-yellow); }
  .seg button[aria-pressed="true"][data-v="hidden"] { background: var(--fw-text-dim); }
  .seg.small button { padding: 2px 7px; }
  .seg button[aria-pressed="true"]:not([data-v]) { background: var(--fw-blue); }
  .expo-filter { display: flex; gap: 10px; align-items: center; font-size: 13px; margin-bottom: 6px; }

  /* Condition builder */
  .cgroup { border: 1.5px solid var(--fw-border-dk); border-radius: 5px; padding: 8px 10px 8px; margin: 4px 0; background: var(--fw-paper); }
  .cgroup .cgroup { background: var(--fw-surface); }
  .cgroup-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .cleaf { border-left: 3px solid var(--fw-border); padding: 6px 0 6px 10px; margin: 6px 0; }
  .cleaf .row { margin-bottom: 5px; }
  .verdict { font-size: 13px; padding: 3px 8px; border-radius: 3px; display: inline-flex; gap: 6px; align-items: baseline; }
  .verdict.pass { background: #E5F1E5; color: var(--fw-green); }
  .verdict.miss { background: #FBEAEA; color: var(--fw-red); }
  .verdict .lbl { font: 700 11px/1 system-ui, sans-serif; letter-spacing: .05em; }
  .cadd { display: flex; gap: 12px; margin-top: 4px; }
  .unit { color: var(--fw-text-dim); font-size: 13px; }

  /* Questions */
  .qcard { border: 1px solid var(--fw-border); border-radius: 4px; padding: 8px 10px; margin-bottom: 10px; background: var(--fw-paper); }
  .qcard-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .qcard-head .qn { font-weight: bold; }
  .choice { display: grid; grid-template-columns: auto 7em 1fr 1fr auto; gap: 6px; align-items: center; margin-bottom: 5px; }
  .choice .rendered { font-size: 13px; color: var(--fw-text-dim); }
  .menu-wrap { position: relative; display: inline-block; }
  .pop { position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; background: var(--fw-surface); border: 1px solid var(--fw-border-dk);
    box-shadow: 0 4px 16px rgba(0,0,0,.2); border-radius: 4px; padding: 4px 0; min-width: 15em; }
  .pop[hidden] { display: none; }
  .pop button { all: unset; display: block; box-sizing: border-box; width: 100%; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .pop button:hover, .pop button:focus { background: var(--fw-bg); color: var(--fw-blue); }
  .pop .pop-sub { color: var(--fw-text-muted); font-size: 12px; }

  /* Problems */
  .ed-problems { flex-shrink: 0; border-top: 2px solid var(--fw-border-dk); background: var(--fw-surface); max-height: 32%; display: flex; flex-direction: column; }
  .ed-problems h3 { margin: 0; font-size: 14px; padding: 6px 20px; display: flex; gap: 8px; align-items: center; }
  .ed-problems ul { list-style: none; margin: 0; padding: 0 0 52px; overflow: auto; }
  .ed-problems li button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 8px; width: 100%; padding: 3px 20px; font-size: 13px; }
  .ed-problems li button:hover, .ed-problems li button:focus-visible { background: var(--fw-bg); color: var(--fw-blue); }
  .ed-problems .where { color: var(--fw-text-muted); min-width: 12em; }
  .ed-problems .blocks { font: 700 10px/1.6 system-ui, sans-serif; color: var(--fw-red); border: 1px solid var(--fw-red); border-radius: 3px; padding: 0 4px; white-space: nowrap; }
  .sev { color: var(--fw-red); }

  /* Live Tool stand-in */
  .tool-box { border: 2px dashed var(--fw-border-dk); border-radius: 6px; padding: 10px; background: var(--fw-bg); }
  .tool-box h3 { margin: 0 0 2px; font-size: 15px; }
  .tool-ph { height: 110px; border: 1px solid var(--fw-border); background: var(--fw-paper); display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--fw-text-muted); font-style: italic; font-size: 13px; margin: 8px 0; padding: 8px; }
  .tctl { display: grid; grid-template-columns: 7.5em 1fr 5.5em; gap: 6px; align-items: center; font-size: 13px; margin-bottom: 4px; }
  .tctl.locked { opacity: .5; }
  .tctl input[type=range] { width: 100%; accent-color: var(--fw-blue); }
  .tctl input[type=number] { width: 100%; font: inherit; padding: 1px 3px; }
  .tlayers { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; margin: 6px 0; }
  .state-tbl { max-height: 260px; overflow: auto; margin-top: 8px; }
  .right-h { font-size: 14px; margin: 16px 0 6px; }

  /* Dialog / toast */
  .toast { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--fw-text); color: #fff;
    padding: 8px 14px; border-radius: 4px; font: 14px/1.4 system-ui, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  dialog { border: 1px solid var(--fw-border-dk); background: var(--fw-surface); color: var(--fw-text); border-radius: 6px; padding: 16px 20px; max-width: 34em; font-family: var(--fw-font); }
  dialog::backdrop { background: rgba(26,16,8,.35); }
  dialog h2 { margin-top: 0; font-size: 17px; }

  .proto-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9999;
    display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px;
    background: #111; color: #fff; font: 600 13px/1 system-ui, sans-serif; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  .proto-bar button { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 999px; }
  .proto-bar button:hover, .proto-bar button:focus-visible { background: #333; }
  .proto-bar span { padding: 0 8px; min-width: 19em; text-align: center; }
</style>
</head>
<body>
<div class="fw-app" id="app">
  <header class="fw-header">
    <h1 class="fw-title">Activity editor</h1>
    <span class="ed-proto-badge" title="Throwaway mockup: fake data, nothing is saved">PROTOTYPE</span>
    <span class="ed-folder">Folder: Instructional-apps ✓</span>
    <div class="ed-header-actions">
      <label for="act-pick" class="muted">Activity</label>
      <select id="act-pick">
        <optgroup label="Phasors">
          <option selected>phasors-impedance (Phasors and Impedance)</option>
        </optgroup>
        <optgroup label="Oscilloscope"><option>phase-period-amplitude</option></optgroup>
        <optgroup label="Electrostatics"><option>coulomb-fields</option></optgroup>
        <optgroup label="Spacetime"><option>lab10-light-clocks</option></optgroup>
        <optgroup label="Fourier"><option>fourier-synthesis</option></optgroup>
      </select>
      <button class="btn" id="new-act" type="button">New Activity…</button>
      <span class="ed-status" id="status">All changes saved</span>
      <div class="menu-wrap">
        <button class="btn" id="preview-btn" type="button" aria-haspopup="true" aria-expanded="false">Preview ▾</button>
        <div class="pop" id="preview-pop" hidden style="left:auto; right:0; padding:10px 12px; min-width:19em;"></div>
      </div>
      <button class="btn primary" id="save-btn" type="button" title="Ctrl+S">Save</button>
    </div>
  </header>
  <div class="ed-main">
    <nav class="ed-col ed-outline" id="outline" aria-label="Activity outline"></nav>
    <div class="ed-middle">
      <div class="ed-form" id="form"></div>
      <section class="ed-problems" id="problems" aria-label="Problems"></section>
    </div>
    <aside class="ed-col ed-right" id="right" aria-label="Live Tool"></aside>
  </div>
</div>
<dialog id="dlg"></dialog>
<div class="proto-bar" role="toolbar" aria-label="Prototype variant switcher">
  <button type="button" id="proto-prev" aria-label="Previous variant">←</button>
  <span id="proto-label"></span>
  <button type="button" id="proto-next" aria-label="Next variant">→</button>
</div>

<script type="module">
import { typeset } from '../vendor.js';

/* ───────────────────────── Fake Tool info (what the page would collect by mounting each Mode) ── */
const CIRCUIT_INPUTS = [
  { id: 'includeR', label: 'R in the loop', kind: 'bool' }, { id: 'includeL', label: 'L in the loop', kind: 'bool' },
  { id: 'includeC', label: 'C in the loop', kind: 'bool' },
  { id: 'V0', label: 'V₀', unit: 'V', min: 0, max: 20, step: 0.1 }, { id: 'R', label: 'R', unit: 'Ω', min: 0, max: 1000, step: 1 },
  { id: 'L', label: 'L', unit: 'mH', min: 0, max: 500, step: 1 }, { id: 'C', label: 'C', unit: 'µF', min: 0.1, max: 50, step: 0.1 },
  { id: 'omega', label: 'ω', unit: 'rad/s', min: 10, max: 10000, step: 10 },
];
const TOOL = {
  id: 'phasors', title: 'Phasors and Impedance',
  modes: {
    sum: {
      title: 'Sum', setupKeys: ['A1', 'phi1', 'A2', 'phi2', 'omega'],
      inputs: [
        { id: 'A1', label: 'A₁', unit: 'V', min: 0, max: 10, step: 0.1 }, { id: 'phi1', label: 'φ₁', unit: '°', min: -180, max: 180, step: 1 },
        { id: 'A2', label: 'A₂', unit: 'V', min: 0, max: 10, step: 0.1 }, { id: 'phi2', label: 'φ₂', unit: '°', min: -180, max: 180, step: 1 },
        { id: 'omega', label: 'ω', unit: 'rad/s', min: 10, max: 10000, step: 10 },
      ],
      controls: [
        { id: 'A1', label: 'A₁ box', group: 'Inputs' }, { id: 'phi1', label: 'φ₁ box', group: 'Inputs' },
        { id: 'A2', label: 'A₂ box', group: 'Inputs' }, { id: 'phi2', label: 'φ₂ box', group: 'Inputs' },
        { id: 'tip1', label: 'Phasor 1 tip (drag)', group: 'Inputs' }, { id: 'tip2', label: 'Phasor 2 tip (drag)', group: 'Inputs' },
        { id: 'crest1', label: 'Crest of v₁ (drag)', group: 'Inputs' }, { id: 'crest2', label: 'Crest of v₂ (drag)', group: 'Inputs' },
        { id: 'omega', label: 'ω slider', group: 'Inputs' }, { id: 'play', label: 'Play / time cursor', group: 'Inputs' },
        { id: 'sum', label: 'Show the resultant v₁ + v₂', group: 'Layers' },
      ],
      state: {
        A1: ['Amplitude A₁', 'V'], phi1: ['Phase φ₁', '°'], A2: ['Amplitude A₂', 'V'], phi2: ['Phase φ₂', '°'],
        omega: ['Angular frequency ω', 'rad/s'], A: ['Resultant amplitude A', 'V'], phi: ['Resultant phase φ', '°'],
      },
    },
    circuit: {
      title: 'Circuit', setupKeys: ['includeR', 'includeL', 'includeC', 'V0', 'R', 'L', 'C', 'omega'],
      inputs: CIRCUIT_INPUTS,
      controls: [
        ...CIRCUIT_INPUTS.map((c) => ({ id: c.id, label: c.kind === 'bool' ? `Include ${c.id.slice(-1)} toggle` : `${c.label} slider`, group: 'Inputs' })),
        { id: 'play', label: 'Play / time cursor', group: 'Inputs' },
        { id: 'Ztotal', label: 'Show Z_total', group: 'Layers' }, { id: 'I', label: 'Show I', group: 'Layers' },
        { id: 'VR', label: 'Show V_R', group: 'Layers' }, { id: 'VL', label: 'Show V_L', group: 'Layers' },
        { id: 'VC', label: 'Show V_C', group: 'Layers' }, { id: 'kvl', label: 'Show KVL closure', group: 'Layers' },

function presetName(q) { return PRESETS.find((p) => ['tol', 'relTol', 'modulus'].every((k) => String(q[k] ?? '') === p.v[k]))?.name ?? 'Custom'; }
function questionCard(q, qi, task, part, pi) {
  const known = modeOf(part).state;
  const head = h('div', { class: 'qcard-head' }, h('span', { class: 'qn' }, `Question ${qi + 1}`),
    h('select', { class: 't', 'aria-label': 'Kind', onchange: (e) => { q.kind = e.target.value; if (q.kind === 'choice' && !q.choices) { q.choices = [{ id: 'a', text: '' }, { id: 'b', text: '' }]; q.correct = 'a'; }
      if (q.kind === 'numeric' && q.answer == null) Object.assign(q, { answer: '', tol: '', relTol: '0.02', modulus: '' }); changed(); renderAll(); } },
    [['numeric', 'Numeric'], ['choice', 'Choice'], ['text', 'Free text']].map(([v, l]) => h('option', { value: v, selected: q.kind === v }, l))),
    h('span', { class: 'flabel', style: 'min-width:0' }, 'id'), textInput(q, 'id', { class: 't mono', style: 'width:7em', 'data-field': `q-${qi}-id` }),
    h('span', { class: 'flabel', style: 'min-width:0' }, 'points'), textInput(q, 'points', { class: 't', type: 'number', min: '0', style: 'width:4em' }),
    h('span', { style: 'flex:1' }),
    h('button', { type: 'button', class: 'lnk', disabled: qi === 0, onclick: () => { [task.questions[qi - 1], task.questions[qi]] = [task.questions[qi], task.questions[qi - 1]]; changed(); renderAll(); } }, '↑'),
    h('button', { type: 'button', class: 'lnk', onclick: () => { task.questions.splice(qi, 1); changed(); renderAll(); } }, 'remove'));
  const body = [h('div', { class: 'row' }, h('label', {}, 'Prompt'), textInput(q, 'prompt', { class: 't wide' }), h('span', { class: 'muted' }, 'names the quantity, as its field label'))];
  if (q.kind === 'numeric') {
    const ans = h('input', { class: 't mono expr', 'data-field': `q-${qi}-answer`, 'aria-label': 'Answer', oninput: (e) => { q.answer = e.target.value; changed(); } });
    ans.value = q.answer;
    const kindBadge = h('span', { class: 'badge' }), live = h('span', { class: 'live' });
    liveUpdaters.push(() => {
      const s = slot(q.answer, liveState(pi), known);
      kindBadge.className = `badge ${s.isExpr ? 'expr' : 'numb'}`; kindBadge.textContent = s.empty ? 'empty' : s.isExpr ? 'State expression' : 'number';
      live.className = s.error ? 'live err' : 'live';
      live.textContent = s.error ? s.error : s.isExpr ? `= ${fmt(s.value)} at the live Tool` : '';
    });
    const presetLabel = h('span'); liveUpdaters.push(() => { presetLabel.textContent = presetName(q); });
    const pop = h('div', { class: 'pop', hidden: true }, PRESETS.map((p) => h('button', { type: 'button', onclick: () => { Object.assign(q, p.v); pop.hidden = true; changed(); renderAll(); } },
      p.name, ' ', h('span', { class: 'pop-sub' }, p.sub))));
    const presetBtn = h('button', { type: 'button', class: 'btn', 'aria-haspopup': 'true', onclick: (e) => { e.stopPropagation(); pop.hidden = !pop.hidden; } }, 'Tolerance: ', presetLabel, ' ▾');
    body.push(h('div', { class: 'row' }, h('label', {}, 'Answer'), ans, kindBadge, live),
      h('div', { class: 'row' }, h('label', {}, ''), h('span', { class: 'muted' }, 'a number, or a State expression worked out from the live State at Submit: IMag * 1000, 1/sqrt(L*C), deg(atan2(A2, A1))')),
      h('div', { class: 'row' }, h('label', {}, 'Tolerance'), h('span', { class: 'menu-wrap' }, presetBtn, pop),
        h('span', { class: 'flabel', style: 'min-width:0' }, 'tol'), textInput(q, 'tol', { class: 't num mono', after: refresh }),
        h('span', { class: 'flabel', style: 'min-width:0' }, 'relTol'), textInput(q, 'relTol', { class: 't num mono', after: refresh }),
        h('span', { class: 'flabel', style: 'min-width:0' }, 'modulus'), textInput(q, 'modulus', { class: 't num mono', after: refresh })));
  } else if (q.kind === 'choice') {
    const rows = q.choices.map((ch, ci) => {
      const rendered = h('span', { class: 'rendered' }); const draw = () => { rendered.innerHTML = ch.text; requestAnimationFrame(() => rendered.isConnected && typeset([rendered])); }; draw();
      return h('div', { class: 'choice' },
        h('input', { type: 'radio', name: `correct-${qi}`, checked: q.correct === ch.id, title: 'Correct choice', 'aria-label': `Choice ${ch.id} is correct`, onchange: () => { q.correct = ch.id; changed(); } }),
        h('input', { class: 't mono', value: ch.id, 'aria-label': 'Choice id', oninput: (e) => { if (q.correct === ch.id) q.correct = e.target.value; ch.id = e.target.value; changed(); } }),
        textInput(ch, 'text', { class: 't', after: draw }), rendered,
        h('span', {}, h('button', { type: 'button', class: 'lnk', disabled: ci === 0, onclick: () => { [q.choices[ci - 1], q.choices[ci]] = [q.choices[ci], q.choices[ci - 1]]; changed(); renderAll(); } }, '↑'), ' ',
          h('button', { type: 'button', class: 'lnk danger', onclick: () => { q.choices.splice(ci, 1); changed(); renderAll(); } }, '✕')));
    });
    body.push(h('div', { class: 'row', style: 'margin-bottom:3px' }, h('span', { class: 'muted' }, '● marks the correct choice · id · text (HTML, \\( \\) math) · as rendered')), ...rows,
      h('button', { type: 'button', class: 'lnk', onclick: () => { q.choices.push({ id: slug('choice', q.choices.map((c) => c.id)), text: '' }); changed(); renderAll(); } }, '+ Choice'));
  } else body.push(h('p', { class: 'muted', style: 'margin:0' }, 'Never judged: the answer is recorded in the Report.'));
  return h('div', { class: 'qcard' }, head, ...body);
}
function secQuestions(part, pi, task) {
  return section('Questions', `${task.questions.length}`, task.questions.map((q, qi) => questionCard(q, qi, task, part, pi)),
    h('div', { class: 'cadd' }, ...[['numeric', '+ Numeric'], ['choice', '+ Choice'], ['text', '+ Free text']].map(([k, l]) => h('button', { type: 'button', class: 'lnk', onclick: () => {
      const id = slug(k === 'numeric' ? 'value' : k, task.questions.map((q) => q.id));
      task.questions.push(k === 'numeric' ? { id, kind: k, prompt: '', answer: '', tol: '', relTol: '0.02', modulus: '', points: 1 }
        : k === 'choice' ? { id, kind: k, prompt: '', points: 1, correct: 'a', choices: [{ id: 'a', text: '' }, { id: 'b', text: '' }] } : { id, kind: k, prompt: '', points: 1 });
      changed(); renderAll(); } }, l))));
}
function secHint(task) {
  if (!task.hint) return section('Hint', null, h('button', { type: 'button', class: 'lnk', onclick: () => { task.hint = { after: 3, text: '' }; changed(); renderAll(); } }, '+ Add a Hint'));
  return section('Hint', 'stored encoded',
    h('div', { class: 'row' }, h('label', {}, 'Appears after'), textInput(task.hint, 'after', { class: 't', type: 'number', min: '1', style: 'width:4em' }), h('span', {}, 'failed Attempts'),
      h('span', { style: 'flex:1' }), h('button', { type: 'button', class: 'lnk danger', onclick: () => { task.hint = null; changed(); renderAll(); } }, 'remove Hint')),
    proseField({ field: 'hint', label: 'Hint', get: () => task.hint.text, set: (v) => { task.hint.text = v; } }));
}

function taskForm() {
  const pi = sel.p, part = activity.parts[pi], ti = sel.t, task = part.tasks[ti];
  const head = [h('h2', {}, task.title), h('div', { class: 'ed-crumb' }, `${part.title} › Task ${ti + 1} of ${part.tasks.length} · ${modeOf(part).title} Mode`)];
  const S = {
    prompt: () => [secBasics(part, task), secPrompt(task)],
    exposure: () => [secExposure(part, ti)],
    condition: () => [secCondition(part, pi, task)],
    questions: () => [secQuestions(part, pi, task)],
    hint: () => [secHint(task), section('Notes', 'not shown to students', notesField(task))],
  };
  if (variant === 'A') return [...head, ...Object.values(S).flatMap((f) => f())];
  if (variant === 'C') return [...head, ...['prompt', 'condition', 'questions', 'hint'].flatMap((k) => S[k]())];
  // B: sectioned tabs
  const probs = problems().filter((p) => p.sel.kind === 'task' && p.sel.p === pi && p.sel.t === ti);
  const tabs = [['prompt', 'Prompt'], ['exposure', 'Exposure'], ['condition', 'Condition'], ['questions', `Questions (${task.questions.length})`], ['hint', 'Hint & notes']];
  const bar = h('div', { class: 'ftabs', role: 'tablist' }, tabs.map(([k, l]) => {
    const n = probs.filter((p) => p.tab === k).length;
    return h('button', { type: 'button', role: 'tab', class: 'fw-tab', 'aria-selected': String(taskTab === k), onclick: () => { taskTab = k; renderAll(); } }, l, n ? h('span', { class: 'ftab-count' }, n) : null);
  }));
  return [...head, bar, ...S[taskTab]()];
}

function renderForm() {
  const f = $('form'); const scroll = f.scrollTop;
  f.replaceChildren(...(sel.kind === 'activity' ? activityForm() : sel.kind === 'part' ? partForm() : taskForm()));
  f.scrollTop = scroll;
  for (const fn of liveUpdaters) fn();
}

/* ───────────────────────── Right column: stand-in for the live Tool ── */
function renderRight() {
  const r = $('right'); r.replaceChildren();
  const pi = sel.kind === 'activity' ? 0 : sel.p, part = activity.parts[pi], mode = modeOf(part), live = liveInputs[pi];
  const eff = sel.kind === 'task' && studentView ? exposureAt(part, sel.t) : null;
  const stateBody = h('tbody');
  const drawState = () => { const s = liveState(pi); stateBody.replaceChildren(...Object.entries(mode.state).map(([n, [l, u]]) =>
    h('tr', {}, h('td', { class: 'cid' }, n), h('td', { style: 'font-size:13px' }, l), h('td', { class: 'live' }, `${fmt(s[n])} ${u}`)))); };
  const onTool = () => { drawState(); for (const f of liveUpdaters) f(); };
  const ctls = mode.inputs.map((c) => {
    const st = eff?.[c.id]?.state ?? 'open'; if (st === 'hidden') return null;
    const dis = st === 'locked';
    if (c.kind === 'bool') return h('label', { class: `tctl${dis ? ' locked' : ''}` }, h('span', {}, c.label), h('input', { type: 'checkbox', checked: live[c.id], disabled: dis, style: 'justify-self:start',
      onchange: (e) => { live[c.id] = e.target.checked; onTool(); } }), h('span', { class: 'unit' }, dis ? '🔒 locked' : ''));
    const num = h('input', { type: 'number', step: c.step, disabled: dis, 'aria-label': `${c.label} (${c.unit})` });
    const rng = h('input', { type: 'range', min: c.min, max: c.max, step: c.step, disabled: dis, 'aria-label': `${c.label} slider` });
    num.value = rng.value = live[c.id];
    const set = (v) => { live[c.id] = +v; num.value = rng.value = v; if (c.id === 'omega') { live.sweepMin = Math.min(live.sweepMin ?? +v, +v); live.sweepMax = Math.max(live.sweepMax ?? +v, +v); } onTool(); };
    rng.oninput = (e) => set(e.target.value); num.onchange = (e) => set(e.target.value);
    return h('div', { class: `tctl${dis ? ' locked' : ''}` }, h('span', {}, `${c.label}${c.unit ? ` (${c.unit})` : ''}`), rng, h('span', { style: 'display:flex; gap:3px; align-items:center' }, num, dis ? '🔒' : ''));
  });
  const layers = mode.controls.filter((c) => c.group === 'Layers').map((c) => {
    const st = eff?.[c.id]?.state ?? 'open'; return h('span', { class: 'muted', style: st === 'hidden' ? 'text-decoration:line-through' : 'font-style:normal' }, `${st === 'hidden' ? '◌' : '●'} ${c.label.replace(/^Show /, '')}`);
  });
  r.append(h('div', { class: 'tool-box' },
    h('h3', {}, `Live Tool · ${mode.title} Mode`), h('div', { class: 'muted' }, `${part.title}: stand-in, the real ${TOOL.title} Tool mounts here`),
    h('div', { class: 'tool-ph' }, `[ ${mode.title === 'Sum' ? 'phasor plane + sinusoids' : 'schematic + phasor plane + impedance plane'} ]`),
    sel.kind === 'task' ? h('label', { style: 'display:flex; gap:6px; font-size:13px; margin-bottom:6px' }, h('input', { type: 'checkbox', checked: studentView, onchange: (e) => { studentView = e.target.checked; renderRight(); } }),
      `As the student sees it at Task ${sel.p + 1}.${sel.t + 1}`) : null,
    ...ctls, h('div', { class: 'tlayers' }, layers),
    h('div', { class: 'muted' }, 'Operating the Tool never changes the Activity, except through Capture or "Use current value".')),
  h('h4', { class: 'right-h' }, 'State now ', h('span', { class: 'muted' }, '(names for Conditions and expressions)')),
  h('div', { class: 'state-tbl' }, h('table', { class: 'grid' }, stateBody)));
  if (variant === 'C' && sel.kind === 'task') r.append(h('div', { style: 'margin-top:14px' }, secExposure(part, sel.t, { compact: true })));
  drawState();
}

/* ───────────────────────── Preview launcher ── */
let pvPart = 0, pvTask = 0;
function renderPreviewPop() {
  const pop = $('preview-pop'); pop.replaceChildren();
  if (sel.kind !== 'activity' && pvPart !== sel.p && !pop.dataset.touched) { pvPart = sel.p; pvTask = sel.kind === 'task' ? sel.t : 0; }
  const blockers = problems().filter((p) => p.blocks);
  const partSel = h('select', { class: 't', onchange: (e) => { pvPart = +e.target.value; pvTask = 0; pop.dataset.touched = '1'; renderPreviewPop(); } },
    activity.parts.map((p, i) => h('option', { value: i, selected: i === pvPart }, p.title)));
  const taskSel = h('select', { class: 't', onchange: (e) => { pvTask = +e.target.value; pop.dataset.touched = '1'; } },
    activity.parts[pvPart].tasks.map((t, i) => h('option', { value: i, selected: i === pvTask }, `${i + 1}. ${t.title}`)));
  pop.append(h('div', { style: 'font-weight:bold; font-size:14px; margin-bottom:6px' }, 'Preview the unsaved Activity'),
    h('div', { class: 'row' }, h('label', {}, 'Start at Part'), partSel), h('div', { class: 'row' }, h('label', {}, 'Task'), taskSel),
    h('div', { class: 'muted', style: 'margin-bottom:8px' }, 'Earlier Tasks count as passed. A throwaway Run: no autosave, never touches a student\'s Run.'),
    blockers.length ? h('div', { style: 'font-size:13px; color:var(--fw-red); margin-bottom:8px' }, `Can't start: the runner would reject the Activity. ${blockers[0].where}: ${blockers[0].msg}`,
      blockers.length > 1 ? ` (and ${blockers.length - 1} more)` : '') : null,
    h('div', { class: 'row', style: 'margin:0' }, h('button', { type: 'button', class: 'btn primary', disabled: blockers.length > 0, onclick: () => startPreview('pane') }, 'Preview here'),
      h('button', { type: 'button', class: 'btn', disabled: blockers.length > 0, onclick: () => startPreview('tab') }, 'In a new tab')));
}
function startPreview(where) {
  $('preview-pop').hidden = true; $('preview-btn').setAttribute('aria-expanded', 'false');
  const p = activity.parts[pvPart]; const t = p.tasks[pvTask];
  const dlg = $('dlg'); dlg.replaceChildren(h('h2', {}, 'Preview (mockup)'),
    h('p', {}, `The real editor would open the runner ${where === 'tab' ? 'in a new tab' : 'in a pane'}, at ${p.title} › Task ${pvTask + 1}: "${t?.title ?? '—'}".`),
    h('p', {}, `Tasks before it (${activity.parts.slice(0, pvPart).reduce((n, x) => n + x.tasks.length, 0) + pvTask}) are marked passed without Attempts. Autosave is off, under the preview id "${activity.id}~preview".`),
    h('button', { type: 'button', class: 'btn primary', onclick: () => dlg.close() }, 'Close'));
  dlg.showModal();
}
$('preview-btn').onclick = (e) => { e.stopPropagation(); const pop = $('preview-pop'); pop.hidden = !pop.hidden; $('preview-btn').setAttribute('aria-expanded', String(!pop.hidden)); if (!pop.hidden) { delete pop.dataset.touched; renderPreviewPop(); } };
$('preview-pop').onclick = (e) => e.stopPropagation();
document.addEventListener('click', () => { $('preview-pop').hidden = true; $('preview-btn').setAttribute('aria-expanded', 'false'); for (const p of document.querySelectorAll('#form .pop')) p.hidden = true; });

/* ───────────────────────── Save, new, unsaved warning ── */
function save() {
  dirty = false; $('status').textContent = 'All changes saved'; $('status').classList.remove('dirty');
  const n = problems().length;
  toast(`Saved (mockup): tools/phasors/activities/${activity.id}.json${n ? ` · saved with ${n} problem(s) listed` : ''}`);
}
$('save-btn').onclick = save;
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
$('act-pick').onchange = (e) => {
  if (dirty && !confirm('This Activity has unsaved changes. Switch anyway and lose them?')) { e.target.selectedIndex = 0; return; }
  e.target.selectedIndex = 0; toast('Mockup: only Phasors and Impedance has fake data');
};
$('new-act').onclick = () => {
  const dlg = $('dlg'); dlg.replaceChildren(h('h2', {}, 'New Activity'),
    h('div', { class: 'row' }, h('label', {}, 'Tool'), h('select', { class: 't' }, ['Phasors', 'Oscilloscope', 'Electrostatics', 'Spacetime', 'Fourier', 'Bench scope', 'Semiconductors', 'App ports'].map((t) => h('option', {}, t)))),
    h('div', { class: 'row' }, h('label', {}, 'Title'), h('input', { class: 't wide', value: 'Resonance in a series RLC' })),
    h('div', { class: 'row' }, h('label', {}, 'id'), h('input', { class: 't mono', value: 'resonance-series-rlc' })),
    h('div', { class: 'row' }, h('label', {}, 'Course'), h('input', { class: 't', value: 'PHY/EGR 3120' })),
    h('p', { class: 'muted' }, 'Writes resonance-series-rlc.json and resonance-series-rlc.html (from the one page template) into tools/phasors/activities/.'),
    h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn primary', onclick: () => { dlg.close(); toast('Mockup: nothing was written'); } }, 'Create'),
      h('button', { type: 'button', class: 'btn', onclick: () => dlg.close() }, 'Cancel')));
  dlg.showModal();
};

/* ───────────────────────── Variant bar ── */
const keys = Object.keys(VARIANTS);
function setVariant(v) {
  variant = v; document.body.dataset.variant = v; const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u);
  $('proto-label').textContent = `${v} (${VARIANTS[v]})`; renderAll();
}
const step = (d) => setVariant(keys[(keys.indexOf(variant) + d + keys.length) % keys.length]);
$('proto-prev').onclick = () => step(-1); $('proto-next').onclick = () => step(1);
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]') || e.ctrlKey || e.metaKey || e.altKey || $('dlg').open) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
setVariant(variant);
</script>
