<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacetime Diagrams</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f3ef;--card:#fff;--ink:#1f2328;--muted:#646a73;--line:#dcd9d2;--accent:#0b6e75;--sel:#f0a500;--warn:#b3261e}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;background:var(--accent);color:#fff}
header.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:#999}
button:disabled{opacity:.45;cursor:default}
header.top button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}
header.top button:hover{background:rgba(255,255,255,.24)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.tools{display:flex;gap:4px;flex-wrap:wrap}
.tools button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tools kbd{font:11px ui-monospace,monospace;opacity:.6;margin-left:4px}
.vel,.grids{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vel input[type=text]{width:66px}
.vel input[type=range]{width:150px}
input[type=text],select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);min-width:0}
input[type=text]:disabled{background:#f1f0ec;color:var(--muted)}
.status{padding:6px 16px;color:var(--muted);font-size:13px;min-height:34px}
.status button{padding:2px 9px;margin-left:4px}
.status b{color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:0 16px 16px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0;align-content:start}
.panels.single{grid-template-columns:minmax(0,1fr)}
.panel{margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.panel figcaption{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}
.panel figcaption .dot{width:10px;height:10px;border-radius:50%}
.panel figcaption .ax{color:var(--muted);font-style:italic;font-family:Georgia,serif}
.svgwrap{position:relative}
.svgwrap svg{display:block;width:100%;aspect-ratio:1/1;max-height:calc(100vh - 210px);min-height:260px;touch-action:none;user-select:none;-webkit-user-select:none}
body[data-tool=select] .svgwrap svg{cursor:grab}
body[data-tool=event] .svgwrap svg,body[data-tool=wl] .svgwrap svg,body[data-tool=rod] .svgwrap svg{cursor:crosshair}
body[data-tool=connect] .svgwrap svg{cursor:pointer}
.hint{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;color:var(--muted);font-size:13px;pointer-events:none;background:rgba(255,255,255,.9);padding:6px;border-radius:6px}
aside{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 12px 12px;align-self:start;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:8px}
aside h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
.row label{display:flex;gap:6px;align-items:center}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.empty{color:var(--muted);font-size:13px;margin:6px 0}
.item{border:1px solid var(--line);border-radius:7px;margin:6px 0;background:#fff}
.item.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ihead{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer}
.ihead .sw{width:12px;height:12px;border-radius:3px;flex:none}
.ihead .kind{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.ihead .sum{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ihead .x{border:none;background:none;font-size:17px;line-height:1;padding:0 4px;color:var(--muted)}
.ihead .x:hover{color:var(--warn)}
.ibody{padding:4px 10px 10px;border-top:1px solid var(--line)}
.ibody .f{margin:6px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ibody .f > label{display:flex;gap:6px;align-items:center}
.num{display:inline-flex;gap:4px;align-items:center}
.num span{font-style:italic;font-family:Georgia,serif;min-width:16px;text-align:right}
.num input{width:64px}
.grid2{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin:6px 0}
.grid2 .fl{font-size:12px;color:var(--muted)}
.swatches{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.swb{width:22px;height:22px;padding:0;border-radius:5px;border:2px solid transparent}
.swb.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.ro{font-size:13px;margin:3px 0}
.ro .m{font-family:Georgia,serif;font-style:italic}
.warn{color:var(--warn);font-size:12.5px;margin:4px 0}
.note{color:var(--muted);font-size:12.5px;margin:4px 0}
.mform{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0;font-size:13px}
.mform input[type=text]{width:52px}
.mitem{border:1px solid var(--line);border-radius:7px;margin:6px 0;padding:6px 8px;font-size:13px;position:relative}
.mitem .x{position:absolute;top:2px;right:4px;border:none;background:none;font-size:17px;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);z-index:10}
#toast.on{opacity:.95}
@media (max-width:1050px){main{grid-template-columns:minmax(0,1fr)} aside{position:static;max-height:none}}
@media (max-width:640px){.panels{grid-template-columns:minmax(0,1fr)} .actions{margin-left:0} .svgwrap svg{max-height:none}}
</style>
</head>
<body data-tool="select">
<header class="top">
  <h1>Spacetime Diagrams</h1>
  <div class="actions">
    <button id="bNew" title="Clear everything (can be undone)">New</button>
    <button id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="bRedo" title="Redo (Ctrl+Y)">Redo</button>
    <button id="bLink" title="Copy a link that opens this exact diagram">Copy link</button>
    <button id="bJson">Export JSON</button>
    <button id="bImport">Import JSON</button>
    <button id="bPng">Save PNG</button>
    <input type="file" id="fImport" accept=".json,application/json" hidden>
  </div>
</header>

<div class="toolbar">
  <div class="tools" role="toolbar" aria-label="Tools">
    <button data-tool="select" title="Move things and pan the view (V)">Move<kbd>V</kbd></button>
    <button data-tool="event" title="Click to add an event (E)">Event<kbd>E</kbd></button>
    <button data-tool="wl" title="Drag to draw a worldline (W)">Worldline<kbd>W</kbd></button>
    <button data-tool="rod" title="Drag sideways to lay a measuring rod (R)">Rod<kbd>R</kbd></button>
    <button data-tool="connect" title="Click events in order to join them (J)">Join events<kbd>J</kbd></button>
  </div>
  <div class="vel">
    <label for="vNum" title="Velocity of the Ship frame relative to the Earth frame, as a fraction of c"><i>v</i>/<i>c</i></label>
    <input type="text" id="vNum" inputmode="decimal" aria-label="v over c">
    <input type="range" id="vRange" min="-0.99" max="0.99" step="0.01" aria-label="v over c slider">
    <label for="gNum"><i>γ</i></label>
    <input type="text" id="gNum" inputmode="decimal" aria-label="gamma">
    <button id="bFlip" title="Reverse the direction of v">± flip</button>
  </div>
  <div class="grids">
    <label><input type="checkbox" id="gridK"> <span id="gridKname">Earth</span> grid</label>
    <label><input type="checkbox" id="gridKp"> <span id="gridKpname">Ship</span> grid</label>
    <label title="Hide the K′ diagram so the K diagram fills the space"><input type="checkbox" id="showKp"> <span id="showKpname">Ship</span> (K′) diagram</label>
    <button id="bReset">Reset view</button>
  </div>
</div>
<div class="status" id="status"></div>

<main>
  <section class="panels">
    <figure class="panel">
      <figcaption><span class="dot" style="background:#4a4a4a"></span><b>K</b><span id="capK">Earth</span><span class="ax">(x, t)</span></figcaption>
      <div class="svgwrap"><svg id="svgK" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spacetime diagram in frame K"></svg><div class="hint" id="hintK"></div></div>
    </figure>
    <figure class="panel" id="figKp">
      <figcaption><span class="dot" style="background:#2d70b3"></span><b>K′</b><span id="capKp">Ship</span><span class="ax">(x′, t′)</span></figcaption>
      <div class="svgwrap"><svg id="svgKp" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spacetime diagram in frame K prime"></svg><div class="hint" id="hintKp"></div></div>
    </figure>
  </section>
  <aside id="side" aria-label="Objects and measurements"></aside>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- constants ---------- */
const PALETTE=['#D55E00','#0072B2','#009E73','#CC79A7','#E69F00','#56B4E9','#7B3294','#333333'];
const GRIDCOL={K:'#4a4a4a',Kp:'#2d70b3'};
const SYM={K:{x:'x',t:'t',tag:'K'},Kp:{x:'x′',t:'t′',tag:'K′'}};
const FR=['K','Kp'];
const other=F=>F==='K'?'Kp':'K';
const VMAX=0.999;
const STORE_KEY='spacetime-diagram-v1';

/* ---------- state ---------- */
function blankState(){return{v:0,names:{K:'Earth',Kp:'Ship'},grid:{K:true,Kp:true},showKp:true,objs:[],nextId:1,colorIdx:0,view:{cx:4,ct:4,span:12.5}};}
let S=blankState();
let sel=null;            // selected object id (UI only)
let tool='select';
let connectIds=[];       // pending events for the Join tool
let drag=null;
let preview=null;        // drawing preview {P,type,a,b}
let undoStack=[],redoStack=[],liveActive=false;
let scrollToSel=false;

/* ---------- physics ---------- */
const gam=v=>1/Math.sqrt(1-v*v);
function toF(F,p){if(F==='K')return[p[0],p[1]];const v=S.v,g=gam(v);return[g*(p[0]-v*p[1]),g*(p[1]-v*p[0])];}
function fromF(F,p){if(F==='K')return[p[0],p[1]];const v=S.v,g=gam(v);return[g*(p[0]+v*p[1]),g*(p[1]+v*p[0])];}
function conv(G,P,p){return G===P?[p[0],p[1]]:toF(P,fromF(G,p));}
const byId=id=>S.objs.find(o=>o.id===id);
const eventsList=()=>S.objs.filter(o=>o.kind==='event');
const wlList=()=>S.objs.filter(o=>o.kind==='wl');
function evK(e){return fromF(e.home,[e.x,e.t]);}
function wlSegs(w){
  if(w.mode==='param')return[{p:fromF(w.frame,[w.x0,0]),d:fromF(w.frame,[w.u,1]),s0:-Infinity,s1:Infinity}];
  const evs=w.ids.map(byId).filter(Boolean),segs=[];
  for(let i=0;i+1<evs.length;i++){const a=evK(evs[i]),b=evK(evs[i+1]);const d=[b[0]-a[0],b[1]-a[1]];if(Math.abs(d[0])<1e-12&&Math.abs(d[1])<1e-12)continue;segs.push({p:a,d,s0:0,s1:1,a:evs[i],b:evs[i+1]});}
  if(w.extend&&segs.length===1){segs[0].s0=-Infinity;segs[0].s1=Infinity;}
  return segs;
}
const isSpacelike=d=>Math.abs(d[0])>Math.abs(d[1])+1e-9;
function segTau(d){const s2=d[1]*d[1]-d[0]*d[0];return s2>0?Math.sqrt(s2):0;}
function velIn(F,d){const e=toF(F,d);return Math.abs(e[1])<1e-12?Infinity:e[0]/e[1];}
function segCut(sg,F,T){const q=toF(F,sg.p),e=toF(F,sg.d);if(Math.abs(e[1])<1e-12)return null;const s=(T-q[1])/e[1];if(s<sg.s0-1e-9||s>sg.s1+1e-9)return null;return{pt:[sg.p[0]+s*sg.d[0],sg.p[1]+s*sg.d[1]],d:sg.d};}
function wlCut(w,F,T){for(const sg of wlSegs(w)){const c=segCut(sg,F,T);if(c)return c;}return null;}
function rodEnd(r,i){
  const end=r.ends[i];
  if(end.wl!=null){const w=byId(end.wl);if(w){const c=wlCut(w,r.frame,r.T);if(c)return{pt:c.pt,d:c.d,wl:w,ok:true};return{pt:fromF(r.frame,[end.x,r.T]),wl:w,ok:false};}}
  return{pt:fromF(r.frame,[end.x,r.T]),wl:null,ok:true};
}
function rodInfo(r){
  const A=rodEnd(r,0),B=rodEnd(r,1);
  const LF=Math.abs(toF(r.frame,A.pt)[0]-toF(r.frame,B.pt)[0]);
  const info={A,B,LF};
  if(A.wl&&B.wl&&A.ok&&B.ok&&A.d&&B.d){
    const ua=A.d[0]/A.d[1],ub=B.d[0]/B.d[1];
    if(Math.abs(A.d[1])>1e-12&&Math.abs(B.d[1])>1e-12&&Math.abs(ua-ub)<1e-6&&Math.abs(ua)<1-1e-9){
      const g=gam(ua),xR=p=>g*(p[0]-ua*p[1]);
      const L0=Math.abs(xR(A.pt)-xR(B.pt));
      const uKp=velIn('Kp',A.d);
      info.parallel={L0,u:{K:ua,Kp:uKp},L:{K:L0*Math.sqrt(1-ua*ua),Kp:L0*Math.sqrt(1-uKp*uKp)}};
    }else info.nonparallel=true;
  }
  return info;
}
function properTime(w,F,t1,t2){
  const lo=Math.min(t1,t2),hi=Math.max(t1,t2);let tau=0,covered=0,spacelike=false;
  for(const sg of wlSegs(w)){
    const q=toF(F,sg.p),e=toF(F,sg.d);if(Math.abs(e[1])<1e-12)continue;
    let sa=(lo-q[1])/e[1],sb=(hi-q[1])/e[1];if(sa>sb)[sa,sb]=[sb,sa];
    sa=Math.max(sa,sg.s0);sb=Math.min(sb,sg.s1);if(sb<=sa)continue;
    if(isSpacelike(e))spacelike=true;
    tau+=(sb-sa)*segTau(e);covered+=(sb-sa)*Math.abs(e[1]);
  }
  return{tau,partial:covered<hi-lo-1e-6,spacelike};
}

/* ---------- formatting ---------- */
function fmt(n,dp=2){if(!Number.isFinite(n))return'—';let s=n.toFixed(dp);if(s.includes('.'))s=s.replace(/\.?0+$/,'');if(s==='-0')s='0';return s.replace('-','−');}
function fmtIn(n){if(!Number.isFinite(n))return'';let s=String(+n.toFixed(4));if(s==='-0')s='0';return s;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parseNum(str){
  if(typeof str!=='string')return NaN;const s=str.trim().replace(/−/g,'-');if(!s)return NaN;
  const m=s.match(/^(-?\d*\.?\d+)\s*\/\s*(-?\d*\.?\d+)$/);if(m)return(+m[1])/(+m[2]);
  return /^-?(\d+\.?\d*|\.\d+)(e-?\d+)?$/i.test(s)?+s:NaN;
}
function linear(lhs,m,v,b){ // lhs = m v + b
  let term='';
  if(Math.abs(m)>=0.005){term=Math.abs(m-1)<0.005?v:Math.abs(m+1)<0.005?'−'+v:fmt(m)+v;}
  if(!term)return`${lhs} = ${fmt(b)}`;
  if(Math.abs(b)<0.005)return`${lhs} = ${term}`;
  return`${lhs} = ${term} ${b>0?'+':'−'} ${fmt(Math.abs(b))}`;
}
function eqLine(P,p,d){
  const q=toF(P,p),e=toF(P,d);
  if(Math.abs(e[1])<1e-12)return`${SYM[P].t} = ${fmt(q[1])}`;
  const u=e[0]/e[1];return linear(SYM[P].x,u,SYM[P].t,q[0]-u*q[1]);
}
function eqRod(P,r,info){
  if(P===r.frame)return`${SYM[P].t} = ${fmt(r.T)}`;
  const a=toF(P,info.A.pt),b=toF(P,info.B.pt);
  if(Math.abs(b[0]-a[0])<1e-9)return`${SYM[P].t} = ${fmt(a[1])}`;
  const m=(b[1]-a[1])/(b[0]-a[0]);return linear(SYM[P].t,m,SYM[P].x,a[1]-m*a[0]);
}
const fname=F=>`${esc(S.names[F])} (${SYM[F].tag})`;

/* ---------- history ---------- */
function snapshot(){const{view,...rest}=S;return JSON.stringify(rest);}
function checkpoint(){undoStack.push(snapshot());if(undoStack.length>300)undoStack.shift();redoStack=[];}
function beginLive(){if(!liveActive){checkpoint();liveActive=true;}}
function endLive(){liveActive=false;}
function restore(json){const o=JSON.parse(json);o.view=S.view;S=normalize(o);if(sel!=null&&!byId(sel))sel=null;connectIds=connectIds.filter(id=>byId(id));render();}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop());}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());}

/* ---------- normalize (imports, links, autosave) ---------- */
function normalize(o){
  const N=blankState();if(!o||typeof o!=='object')return N;
  const num=(v,d)=>Number.isFinite(+v)&&v!==null&&v!==''?+v:d;
  const col=c=>typeof c==='string'&&/^#[0-9a-fA-F]{6}$/.test(c)?c:PALETTE[0];
  const fr=f=>f==='Kp'?'Kp':'K';
  const str=(s,d)=>typeof s==='string'?s.slice(0,40):d;
  N.v=Math.max(-VMAX,Math.min(VMAX,num(o.v,0)));
  if(o.names){N.names.K=str(o.names.K,'Earth')||'Earth';N.names.Kp=str(o.names.Kp,'Ship')||'Ship';}
  if(o.grid){N.grid.K=o.grid.K!==false;N.grid.Kp=o.grid.Kp!==false;}
  N.showKp=o.showKp!==false;
  if(o.view){N.view.cx=num(o.view.cx,4);N.view.ct=num(o.view.ct,4);N.view.span=Math.max(0.5,Math.min(400,num(o.view.span,12.5)));}
  N.colorIdx=Math.max(0,Math.floor(num(o.colorIdx,0)));
  const objs=Array.isArray(o.objs)?o.objs:[];const out=[];const seen=new Set();
  for(const a of objs){
    if(!a||typeof a!=='object')continue;const id=Math.floor(num(a.id,NaN));if(!Number.isFinite(id)||seen.has(id))continue;
    const base={id,color:col(a.color),label:str(a.label,'')};
    if(a.kind==='event')out.push({...base,kind:'event',home:fr(a.home),x:num(a.x,0),t:num(a.t,0),showCoords:!!a.showCoords,cone:!!a.cone});
    else if(a.kind==='wl'&&a.mode==='param')out.push({...base,kind:'wl',mode:'param',frame:fr(a.frame),u:Math.max(-1,Math.min(1,num(a.u,0))),x0:num(a.x0,0),showEq:!!a.showEq});
    else if(a.kind==='wl'&&a.mode==='chain'&&Array.isArray(a.ids))out.push({...base,kind:'wl',mode:'chain',ids:a.ids.map(Number).filter(Number.isFinite),extend:!!a.extend,showEq:!!a.showEq});
    else if(a.kind==='rod'&&Array.isArray(a.ends)&&a.ends.length===2)out.push({...base,kind:'rod',frame:fr(a.frame),T:num(a.T,0),ends:a.ends.map(e=>({x:num(e&&e.x,0),wl:e&&e.wl!=null&&Number.isFinite(+e.wl)?+e.wl:null})),showEq:!!a.showEq});
    else if(a.kind==='interval')out.push({id,kind:'interval',a:+a.a,b:+a.b});
    else if(a.kind==='ptime')out.push({id,kind:'ptime',wl:+a.wl,frame:fr(a.frame),t1:num(a.t1,0),t2:num(a.t2,1)});
    else continue;
    seen.add(id);
  }
  const has=(id,kind)=>out.some(x=>x.id===id&&x.kind===kind);
  N.objs=out.filter(x=>{
    if(x.kind==='wl'&&x.mode==='chain'){x.ids=x.ids.filter(i=>has(i,'event'));return x.ids.length>=2;}
    if(x.kind==='interval')return has(x.a,'event')&&has(x.b,'event');
    if(x.kind==='ptime')return has(x.wl,'wl');
    if(x.kind==='rod')x.ends.forEach(e=>{if(e.wl!=null&&!has(e.wl,'wl'))e.wl=null;});
    return true;
  });
  N.nextId=Math.max(num(o.nextId,1),...N.objs.map(x=>x.id+1),1);
  return N;
}

/* ---------- object creation ---------- */
function nextColor(){const c=PALETTE[S.colorIdx%PALETTE.length];S.colorIdx++;return c;}
function nextLabel(kind){
  if(kind==='event'){const used=new Set(eventsList().map(e=>e.label));for(let r=0;;r++)for(let i=0;i<26;i++){const l=String.fromCharCode(65+i)+(r?r:'');if(!used.has(l))return l;}}
  const pre=kind==='wl'?'W':'R';const used=new Set(S.objs.map(o=>o.label));for(let n=1;;n++)if(!used.has(pre+n))return pre+n;
}
function addObj(o){o.id=S.nextId++;S.objs.push(o);sel=o.id;scrollToSel=true;return o;}
function newEvent(home,x,t){return addObj({kind:'event',home,x,t,color:nextColor(),label:nextLabel('event'),showCoords:false,cone:false});}
function newParamWl(frame,u,x0){return addObj({kind:'wl',mode:'param',frame,u,x0,color:nextColor(),label:nextLabel('wl'),showEq:false});}
function newRod(frame,T,x1,x2){return addObj({kind:'rod',frame,T,ends:[{x:x1,wl:null},{x:x2,wl:null}],color:nextColor(),label:nextLabel('rod'),showEq:false});}

function deleteObj(id){
  const o=byId(id);if(!o)return;checkpoint();
  const del=new Set([id]);let changed=true;
  while(changed){changed=false;for(const x of S.objs){if(del.has(x.id))continue;
    if((x.kind==='wl'&&x.mode==='chain'&&x.ids.some(i=>del.has(i)))||(x.kind==='interval'&&(del.has(x.a)||del.has(x.b)))||(x.kind==='ptime'&&del.has(x.wl))){del.add(x.id);changed=true;}}}
  let detached=0;
  for(const r of S.objs)if(r.kind==='rod'&&!del.has(r.id))r.ends.forEach((e,i)=>{if(e.wl!=null&&del.has(e.wl)){e.x=toF(r.frame,rodEnd(r,i).pt)[0];e.wl=null;detached++;}});
  S.objs=S.objs.filter(x=>!del.has(x.id));
  if(del.has(sel))sel=null;connectIds=connectIds.filter(i=>!del.has(i));
  const extra=del.size-1;const name=o.label||kindName(o);
  let msg=`Deleted ${name}`;if(extra)msg+=` and ${extra} object${extra>1?'s':''} that depended on it`;if(detached)msg+=`; ${detached} rod end${detached>1?'s':''} detached`;
  toast(msg+'. Ctrl+Z to undo.');render();
}
function kindName(o){return o.kind==='event'?'event':o.kind==='rod'?'rod':o.kind==='wl'?'worldline':o.kind==='interval'?'interval':'proper time';}

/* ---------- geometry for drawing ---------- */
function clip(q,e,s0,s1,R){
  let a=s0,b=s1;
  for(const[p,d,lo,hi]of[[q[0],e[0],R.xmin,R.xmax],[q[1],e[1],R.tmin,R.tmax]]){
    if(Math.abs(d)<1e-12){if(p<lo||p>hi)return null;continue;}
    let u1=(lo-p)/d,u2=(hi-p)/d;if(u1>u2){const t=u1;u1=u2;u2=t;}
    if(u1>a)a=u1;if(u2<b)b=u2;if(a>b)return null;
  }
  if(!Number.isFinite(a)||!Number.isFinite(b))return null;return[a,b];
}
function niceStep(s){for(const x of[0.1,0.2,0.5,1,2,5,10,20,50,100,200,500])if(x*s>=26)return x;return 1000;}

const svgs={K:document.getElementById('svgK'),Kp:document.getElementById('svgKp')};
const geom={};

function drawPanel(P){
  const svg=svgs[P];const w=svg.clientWidth,h=svg.clientHeight;if(!w||!h)return;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const V=S.view,s=Math.min(w,h)/V.span;
  const R={xmin:V.cx-w/2/s,xmax:V.cx+w/2/s,tmin:V.ct-h/2/s,tmax:V.ct+h/2/s};
  geom[P]={w,h,s,R};
  const X=x=>w/2+(x-V.cx)*s,Y=t=>h/2-(t-V.ct)*s,f=n=>n.toFixed(1);
  const inView=(px,py,m=0)=>px>=m&&px<=w-m&&py>=m&&py<=h-m;
  const out=[];
  const seg=(q,e,s0,s1,attrs)=>{const c=clip(q,e,s0,s1,R);if(!c)return null;const a=[q[0]+c[0]*e[0],q[1]+c[0]*e[1]],b=[q[0]+c[1]*e[0],q[1]+c[1]*e[1]];out.push(`<line x1="${f(X(a[0]))}" y1="${f(Y(a[1]))}" x2="${f(X(b[0]))}" y2="${f(Y(b[1]))}" ${attrs}/>`);return[a,b];};
  const text=(x,y,str,attrs='')=>out.push(`<text x="${f(x)}" y="${f(y)}" font-family="system-ui, sans-serif" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round" ${attrs}>${esc(str)}</text>`);
  out.push(`<rect width="${w}" height="${h}" fill="#ffffff"/>`);
  out.push('<g pointer-events="none">');
  const step=niceStep(s),ls=step*s<40?step*2:step;
  const order=[other(P),P];
  // grid lines
  for(const G of order){
    if(!S.grid[G])continue;
    const cs=[[R.xmin,R.tmin],[R.xmax,R.tmin],[R.xmin,R.tmax],[R.xmax,R.tmax]].map(c=>conv(P,G,c));
    const ex=conv(G,P,[1,0]),et=conv(G,P,[0,1]);
    const attr=`stroke="${GRIDCOL[G]}" stroke-opacity="${G===P?0.22:0.3}" stroke-width="1"`;
    let lo=Math.ceil(Math.min(...cs.map(c=>c[0]))/step),hi=Math.floor(Math.max(...cs.map(c=>c[0]))/step);
    if(hi-lo<900)for(let n=lo;n<=hi;n++)if(n)seg(conv(G,P,[n*step,0]),et,-Infinity,Infinity,attr);
    lo=Math.ceil(Math.min(...cs.map(c=>c[1]))/step);hi=Math.floor(Math.max(...cs.map(c=>c[1]))/step);
    if(hi-lo<900)for(let n=lo;n<=hi;n++)if(n)seg(conv(G,P,[0,n*step]),ex,-Infinity,Infinity,attr);
  }
  // axes, tick numbers, axis names (always shown)
  for(const G of order){
    if(G!==P&&Math.abs(S.v)<1e-9)continue; // frames coincide: draw one set of axes
    const col=GRIDCOL[G],o=conv(G,P,[0,0]);
    for(const[dir,name,isX]of[[conv(G,P,[1,0]),SYM[G].x,true],[conv(G,P,[0,1]),SYM[G].t,false]]){
      const c=clip(o,dir,-Infinity,Infinity,R);if(!c)continue;
      seg(o,dir,-Infinity,Infinity,`stroke="${col}" stroke-width="${G===P?1.8:1.5}"`);
      const n0=Math.ceil(c[0]/ls),n1=Math.floor(c[1]/ls);
      if(n1-n0<300)for(let n=n0;n<=n1;n++){if(!n)continue;const p=[o[0]+n*ls*dir[0],o[1]+n*ls*dir[1]];const px=X(p[0]),py=Y(p[1]);if(!inView(px,py,10))continue;
        if(isX)text(px,py+14,fmt(n*ls),`text-anchor="middle" fill="${col}" font-size="10.5"`);else text(px-5,py+4,fmt(n*ls),`text-anchor="end" fill="${col}" font-size="10.5"`);}
      const end=[o[0]+c[1]*dir[0],o[1]+c[1]*dir[1]];let px=X(end[0]),py=Y(end[1]);
      const dx=dir[0]*s,dy=-dir[1]*s,len=Math.hypot(dx,dy);px-=dx/len*16;py-=dy/len*16;
      text(isX?px:px+9,isX?py-7:py,name,`fill="${col}" font-size="16" font-style="italic" font-family="Georgia, serif" font-weight="600" text-anchor="${isX?'middle':'start'}"`);
    }
  }
  out.push('</g>');
  // light cones
  for(const e of eventsList()){
    if(!e.cone)continue;const p=toF(P,evK(e)),L=V.span*4;
    out.push(`<polygon points="${f(X(p[0]))},${f(Y(p[1]))} ${f(X(p[0]+L))},${f(Y(p[1]+L))} ${f(X(p[0]-L))},${f(Y(p[1]+L))}" fill="${e.color}" fill-opacity="0.07" pointer-events="none"/>`);
    out.push(`<polygon points="${f(X(p[0]))},${f(Y(p[1]))} ${f(X(p[0]+L))},${f(Y(p[1]-L))} ${f(X(p[0]-L))},${f(Y(p[1]-L))}" fill="${e.color}" fill-opacity="0.04" pointer-events="none"/>`);
    for(const d of[[1,1],[-1,1]])seg(p,d,-Infinity,Infinity,`stroke="${e.color}" stroke-opacity="0.7" stroke-width="1.3" pointer-events="none"`);
  }
  const labels=[];
  // rods
  for(const r of S.objs){
    if(r.kind!=='rod')continue;const info=rodInfo(r);
    const a=toF(P,info.A.pt),b=toF(P,info.B.pt);const ax=X(a[0]),ay=Y(a[1]),bx=X(b[0]),by=Y(b[1]);
    if(r.id===sel)out.push(`<line x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx)}" y2="${f(by)}" stroke="${'#f0a500'}" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round" pointer-events="none"/>`);
    out.push(`<line x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx)}" y2="${f(by)}" stroke="${r.color}" stroke-width="3" stroke-dasharray="0.1 6" stroke-linecap="round" pointer-events="none"/>`);
    out.push(`<line x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx)}" y2="${f(by)}" stroke="#000" stroke-opacity="0" stroke-width="14" pointer-events="stroke" data-id="${r.id}" data-role="rod"/>`);
    [[ax,ay],[bx,by]].forEach(([x,y],i)=>out.push(`<circle cx="${f(x)}" cy="${f(y)}" r="5" fill="#fff" stroke="${r.color}" stroke-width="2" data-id="${r.id}" data-role="rodend" data-i="${i}"/>`));
    let t=r.label;if(r.showEq)t+=(t?': ':'')+eqRod(P,r,info)+(P===r.frame?`, L = ${fmt(info.LF)}`:'');
    if(t)labels.push([(ax+bx)/2,(ay+by)/2-10,t,r.color,'middle']);
  }
  // worldlines
  for(const w of wlList()){
    const segs=wlSegs(w);let top=null;
    segs.forEach((sg,i)=>{
      const q=toF(P,sg.p),e=toF(P,sg.d);const c=clip(q,e,sg.s0,sg.s1,R);if(!c)return;
      const a=[q[0]+c[0]*e[0],q[1]+c[0]*e[1]],b=[q[0]+c[1]*e[0],q[1]+c[1]*e[1]];
      const L=`x1="${f(X(a[0]))}" y1="${f(Y(a[1]))}" x2="${f(X(b[0]))}" y2="${f(Y(b[1]))}"`;
      const bad=isSpacelike(e);
      if(w.id===sel)out.push(`<line ${L} stroke="#f0a500" stroke-opacity="0.35" stroke-width="9" stroke-linecap="round" pointer-events="none"/>`);
      out.push(`<line ${L} stroke="${bad?'#b3261e':w.color}" stroke-width="2.5" ${bad?'stroke-dasharray="6 4"':''} stroke-linecap="round" pointer-events="none"/>`);
      out.push(`<line ${L} stroke="#000" stroke-opacity="0" stroke-width="14" pointer-events="stroke" data-id="${w.id}" data-role="wl"/>`);
      const up=e[1]>=0?b:a,dn=e[1]>=0?a:b;
      const lp=[dn[0]+0.85*(up[0]-dn[0]),dn[1]+0.85*(up[1]-dn[1])];
      if(!top||lp[1]>top[1])top=lp;
      if(w.showEq&&w.mode==='chain'&&segs.length>1){const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];labels.push([X(m[0])+8,Y(m[1]),eqLine(P,sg.p,sg.d),w.color,'start']);}
    });
    if(top){let t=w.label;if(w.showEq&&!(w.mode==='chain'&&segs.length>1)&&segs.length)t+=(t?': ':'')+eqLine(P,segs[0].p,segs[0].d);if(t)labels.push([X(top[0])+8,Y(top[1]),t,w.color,'start']);}
  }
  // events
  for(const e of eventsList()){
    const p=toF(P,evK(e)),px=X(p[0]),py=Y(p[1]);
    if(e.id===sel)out.push(`<circle cx="${f(px)}" cy="${f(py)}" r="11" fill="#f0a500" fill-opacity="0.35" pointer-events="none"/>`);
    if(connectIds.includes(e.id))out.push(`<circle cx="${f(px)}" cy="${f(py)}" r="10" fill="none" stroke="#f0a500" stroke-width="2.5" pointer-events="none"/>`);
    out.push(`<circle cx="${f(px)}" cy="${f(py)}" r="6.5" fill="${e.color}" stroke="#fff" stroke-width="1.5" data-id="${e.id}" data-role="event"/>`);
    let t=e.label;if(e.showCoords)t+=` (${fmt(p[0])}, ${fmt(p[1])})`;
    if(t.trim())labels.push([px+9,py-9,t.trim(),e.color,'start']);
  }
  // join-tool polyline
  if(tool==='connect'&&connectIds.length>1){const pts=connectIds.map(byId).filter(Boolean).map(e=>{const p=toF(P,evK(e));return`${f(X(p[0]))},${f(Y(p[1]))}`;}).join(' ');out.push(`<polyline points="${pts}" fill="none" stroke="#f0a500" stroke-width="2" stroke-dasharray="5 4" pointer-events="none"/>`);}
  // previews
  if(preview){
    const a=conv(preview.P,P,preview.a),b=conv(preview.P,P,preview.b);
    if(preview.type==='wl'){const d=[b[0]-a[0],b[1]-a[1]];if(Math.hypot(...d)>1e-9)seg(a,d,-Infinity,Infinity,'stroke="#f0a500" stroke-width="2" stroke-dasharray="6 4" pointer-events="none"');}
    else out.push(`<line x1="${f(X(a[0]))}" y1="${f(Y(a[1]))}" x2="${f(X(b[0]))}" y2="${f(Y(b[1]))}" stroke="#f0a500" stroke-width="3" stroke-dasharray="0.1 6" stroke-linecap="round" pointer-events="none"/>`);
  }
  for(const[x,y,t,c,anchor]of labels){const cx=Math.max(4,Math.min(w-4,x)),cy=Math.max(14,Math.min(h-6,y));text(cx,cy,t,`fill="${c}" font-weight="600" text-anchor="${anchor==='start'&&cx>w-60?'end':anchor}" pointer-events="none"`);}
  svg.innerHTML=out.join('');
}

/* ---------- sidebar ---------- */
const side=document.getElementById('side');
function numIn(id,k,val,label,dis=false){return`<label class="num"><span>${label}</span><input type="text" inputmode="decimal" data-id="${id}" data-k="${k}" data-fk="${id}:${k}" value="${esc(fmtIn(val))}" ${dis?'disabled':''}></label>`;}
function chk(id,k,on,label){return`<label><input type="checkbox" data-id="${id}" data-k="${k}" data-fk="${id}:${k}" ${on?'checked':''}> ${label}</label>`;}
function frameSel(id,k,val){return`<select data-id="${id}" data-k="${k}" data-fk="${id}:${k}" data-val="${val}">${FR.map(F=>`<option value="${F}">${fname(F)}</option>`).join('')}</select>`;}
function summary(o){
  if(o.kind==='event')return`${SYM[o.home].tag}: (${fmt(o.x)}, ${fmt(o.t)})`;
  if(o.kind==='wl'){if(o.mode==='param')return eqLine(o.frame,...(s=>[s.p,s.d])(wlSegs(o)[0]));return o.ids.map(i=>byId(i)?.label||'?').join(' → ');}
  if(o.kind==='rod'){const i=rodInfo(o);return`${SYM[o.frame].t} = ${fmt(o.T)}, L = ${fmt(i.LF)}`;}
  return'';
}
function itemHtml(o){
  const open=o.id===sel,id=o.id;
  let h=`<div class="item${open?' open':''}" data-item="${id}"><div class="ihead" data-act="sel" data-id="${id}"><span class="sw" style="background:${o.color}"></span><b>${esc(o.label||'(no label)')}</b><span class="kind">${kindName(o)}</span><span class="sum">${esc(summary(o))}</span><button class="x" data-act="del" data-id="${id}" aria-label="Delete ${esc(o.label||kindName(o))}" title="Delete">×</button></div>`;
  if(!open)return h+'</div>';
  h+=`<div class="ibody"><div class="f"><label>Label <input type="text" data-id="${id}" data-k="label" data-fk="${id}:label" value="${esc(o.label)}" style="width:110px"></label></div>`;
  h+=`<div class="swatches">${PALETTE.map(c=>`<button class="swb${c===o.color?' on':''}" style="background:${c}" data-act="color" data-id="${id}" data-color="${c}" aria-label="Colour ${c}" title="Colour"></button>`).join('')}</div>`;
  if(o.kind==='event'){
    const pK=evK(o),pKp=toF('Kp',pK);
    h+=`<div class="f"><label>Fixed in ${frameSel(id,'home',o.home)}</label></div>`;
    h+=`<div class="grid2"><span class="fl">${fname('K')}</span><span>${numIn(id,'xK',pK[0],'x')} ${numIn(id,'tK',pK[1],'t')}</span><span class="fl">${fname('Kp')}</span><span>${numIn(id,'xKp',pKp[0],'x′')} ${numIn(id,'tKp',pKp[1],'t′')}</span></div>`;
    h+=`<div class="f">${chk(id,'showCoords',o.showCoords,'Show coordinates')} ${chk(id,'cone',o.cone,'Light cone')}</div>`;
    h+=`<div class="note">“Fixed in” is the frame whose coordinates stay put when you change <i>v</i>.</div>`;
  }else if(o.kind==='wl'&&o.mode==='param'){
    const sg=wlSegs(o)[0];const F=o.frame;
    h+=`<div class="f"><label>Defined in ${frameSel(id,'frame',F)}</label></div>`;
    h+=`<div class="f">${numIn(id,'u',o.u,'u')} ${numIn(id,'x0',o.x0,SYM[F].x+'₀')}</div>`;
    h+=`<div class="note">${SYM[F].x} = u${SYM[F].t} + ${SYM[F].x}₀, with |u| ≤ 1.</div>`;
    h+=`<div class="f">Through point <label class="num"><span>${SYM[F].x}</span><input type="text" data-keep data-fk="${id}:thx" id="thx${id}" inputmode="decimal"></label><label class="num"><span>${SYM[F].t}</span><input type="text" data-keep data-fk="${id}:tht" id="tht${id}" inputmode="decimal"></label><button data-act="through" data-id="${id}">Apply</button></div>`;
    for(const P of FR)h+=`<div class="ro">${fname(P)}: <span class="m">${esc(eqLine(P,sg.p,sg.d))}</span>, velocity ${fmt(velIn(P,sg.d))}c</div>`;
    h+=`<div class="f">${chk(id,'showEq',o.showEq,'Show equation on diagram')}</div>`;
  }else if(o.kind==='wl'){
    const segs=wlSegs(o);
    h+=`<div class="ro">Events: ${o.ids.map(i=>esc(byId(i)?.label||'?')).join(' → ')}</div>`;
    let tau=0;
    segs.forEach(sg=>{const bad=isSpacelike(sg.d);tau+=segTau(sg.d);
      h+=`<div class="ro"><b>${esc(sg.a.label)}→${esc(sg.b.label)}</b>: <span class="m">${esc(eqLine('K',sg.p,sg.d))}</span> | <span class="m">${esc(eqLine('Kp',sg.p,sg.d))}</span>${bad?'':`, Δτ = ${fmt(segTau(sg.d))}`}</div>`;
      if(bad)h+=`<div class="warn">${esc(sg.a.label)}→${esc(sg.b.label)} is spacelike, so nothing can travel it. Move an event, or use a rod for a spacelike line.</div>`;});
    if(segs.length>1||!o.extend)h+=`<div class="ro">Total proper time <span class="m">Δτ</span> = <b>${fmt(tau)}</b></div>`;
    h+=`<div class="f">${segs.length===1?chk(id,'extend',o.extend,'Extend past the events')+' ':''}${chk(id,'showEq',o.showEq,'Show equation on diagram')}</div>`;
  }else if(o.kind==='rod'){
    const info=rodInfo(o),F=o.frame;
    h+=`<div class="f"><label>Simultaneous in ${frameSel(id,'frame',F)}</label> ${numIn(id,'T',o.T,SYM[F].t+' =')}</div>`;
    [0,1].forEach(i=>{const end=o.ends[i],E=i?info.B:info.A;const xF=toF(F,E.pt)[0];
      h+=`<div class="f">End ${i+1}: <select data-id="${id}" data-k="end${i}" data-fk="${id}:end${i}" data-val="${end.wl==null?'free':end.wl}"><option value="free">free</option>${wlList().map(w=>`<option value="${w.id}">on ${esc(w.label||'worldline')}</option>`).join('')}</select> ${numIn(id,'ex'+i,xF,SYM[F].x,end.wl!=null)}</div>`;
      if(end.wl!=null&&!E.ok)h+=`<div class="warn">${esc(E.wl.label)} doesn’t reach ${SYM[F].t} = ${fmt(o.T)}, so this end uses its free position.</div>`;});
    h+=`<div class="ro">Length in ${fname(F)}: <b>L = ${fmt(info.LF)}</b></div>`;
    if(info.parallel){const p=info.parallel;
      h+=`<div class="ro">Ends move at ${fmt(p.u.K)}c in ${fname('K')}, ${fmt(p.u.Kp)}c in ${fname('Kp')}.</div>`;
      h+=`<div class="ro">Proper length (rest frame of the ends): <b><span class="m">L</span>₀ = ${fmt(p.L0)}</b></div>`;
      h+=`<div class="ro">Measured in ${fname('K')}: ${fmt(p.L.K)}; in ${fname('Kp')}: ${fmt(p.L.Kp)}</div>`;}
    else if(info.nonparallel)h+=`<div class="note">The two end worldlines move at different velocities, so the rod has no single rest frame or proper length.</div>`;
    else h+=`<div class="note">Attach both ends to worldlines that move together to see the proper length.</div>`;
    h+=`<div class="f">${chk(id,'showEq',o.showEq,'Show equation and length on diagram')}</div>`;
  }
  return h+'</div></div>';
}
function measureHtml(m){
  let h=`<div class="mitem" data-item="${m.id}"><button class="x" data-act="del" data-id="${m.id}" aria-label="Delete measurement" title="Delete">×</button>`;
  if(m.kind==='interval'){
    const a=byId(m.a),b=byId(m.b);const A=evK(a),B=evK(b);const dK=[B[0]-A[0],B[1]-A[1]],dKp=toF('Kp',dK);const s2=dK[1]*dK[1]-dK[0]*dK[0];
    h+=`<b>Interval ${esc(a.label)} → ${esc(b.label)}</b>`;
    h+=`<div class="ro">${fname('K')}: <span class="m">Δx</span> = ${fmt(dK[0])}, <span class="m">Δt</span> = ${fmt(dK[1])}</div>`;
    h+=`<div class="ro">${fname('Kp')}: <span class="m">Δx′</span> = ${fmt(dKp[0])}, <span class="m">Δt′</span> = ${fmt(dKp[1])}</div>`;
    h+=`<div class="ro"><span class="m">s</span>² = Δt² − Δx² = <b>${fmt(s2)}</b> (the same in both frames)</div>`;
    const tol=1e-6*Math.max(1,dK[0]*dK[0]+dK[1]*dK[1]);
    if(Math.abs(s2)<tol)h+=`<div class="ro">Lightlike: only a light signal could connect them.</div>`;
    else if(s2>0)h+=`<div class="ro">Timelike: proper time between them <span class="m">Δτ</span> = ${fmt(Math.sqrt(s2))}</div>`;
    else h+=`<div class="ro">Spacelike: proper distance = ${fmt(Math.sqrt(-s2))}. No signal can connect them.</div>`;
  }else{

    h+=`<b>Proper time on ${esc(w.label||'worldline')}</b><div class="mform"><span>in ${frameSel(m.id,'frame',m.frame)}</span> ${numIn(m.id,'t1',m.t1,T+'₁')} ${numIn(m.id,'t2',m.t2,T+'₂')}</div>`;
    h+=`<div class="ro">Coordinate time ${fmt(Math.abs(m.t2-m.t1))}, proper time <b><span class="m">Δτ</span> = ${fmt(r.tau)}</b></div>`;
    if(r.partial)h+=`<div class="warn">The worldline covers only part of this time range, so Δτ counts only that part.</div>`;

function renderSidebar(){

function morph(a,b){
  const bn=[...b.childNodes];
  for(let i=0;i<bn.length;i++){
    const nb=bn[i],na=a.childNodes[i];
    if(!na){a.appendChild(nb.cloneNode(true));continue;}
    if(na.nodeType!==nb.nodeType||na.nodeName!==nb.nodeName||(na.nodeType===1&&(na.getAttribute('data-item')!==nb.getAttribute('data-item')))){a.replaceChild(nb.cloneNode(true),na);continue;}
    if(na.nodeType===3){if(na.data!==nb.data)na.data=nb.data;continue;}
    if(na.nodeType!==1)continue;
    for(const at of[...na.attributes])if(!nb.hasAttribute(at.name)&&at.name!=='value')na.removeAttribute(at.name);
    for(const at of[...nb.attributes])if(na.getAttribute(at.name)!==at.value)na.setAttribute(at.name,at.value);
    if(na.tagName==='INPUT'&&!na.hasAttribute('data-keep')){if(na.type==='checkbox')na.checked=nb.hasAttribute('checked');else if(document.activeElement!==na)na.value=nb.getAttribute('value')??'';}
    morph(na,nb);
  }
  while(a.childNodes.length>bn.length)a.removeChild(a.lastChild);
}

    const W=stacked?Math.max(...g.map(a=>a.w))+2*gap:g.reduce((s,a)=>s+a.w,0)+(g.length+1)*gap;

      const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);});

/* ---------- pointer interaction ---------- */
const pointers=new Map();
function ptOf(P,ev){const r=svgs[P].getBoundingClientRect(),g=geom[P];const px=ev.clientX-r.left,py=ev.clientY-r.top;return{px,py,x:S.view.cx+(px-g.w/2)/g.s,t:S.view.ct-(py-g.h/2)/g.s};}
const snap=(v,free)=>free?v:Math.round(v*10)/10;
function toPx(P,p){const g=geom[P];return[g.w/2+(p[0]-S.view.cx)*g.s,g.h/2-(p[1]-S.view.ct)*g.s];}
function nearestEvent(P,px,py,r=12){let best=null,bd=r;for(const e of eventsList()){const q=toF(P,evK(e));const[x,y]=toPx(P,q);const d=Math.hypot(x-px,y-py);if(d<bd){bd=d;best={e,q};}}return best;}
function nearestCut(P,F,T,px,py,r=12){let best=null,bd=r;for(const w of wlList()){const c=wlCut(w,F,T);if(!c)continue;const[x,y]=toPx(P,toF(P,c.pt));const d=Math.hypot(x-px,y-py);if(d<bd){bd=d;best=w;}}return best;}

for(const P of FR){
  const svg=svgs[P];
  svg.addEventListener('pointerdown',ev=>{
    if(ev.button>0)return;
    svg.setPointerCapture(ev.pointerId);pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(pointers.size===2){const[a,b]=[...pointers.values()];drag={type:'pinch',P,dist:Math.hypot(a.x-b.x,a.y-b.y),span:S.view.span,mid:[(a.x+b.x)/2,(a.y+b.y)/2]};preview=null;return;}
    const tgt=ev.target.closest('[data-id]');const id=tgt?+tgt.dataset.id:null,role=tgt?tgt.dataset.role:null;
    const pt=ptOf(P,ev);
    drag={P,type:'pan',sx:ev.clientX,sy:ev.clientY,lx:ev.clientX,ly:ev.clientY,moved:false,id,pt0:pt};
    if(tool==='select'||tool==='event'){
      if(id!=null){sel=id;scrollToSel=true;const o=byId(id);
        if(role==='event')drag.type='event';
        else if(role==='rodend'){drag.type='rodend';drag.i=+tgt.dataset.i;}
        else if(role==='rod')drag.type='rodT';
        else if(role==='wl'&&o.mode==='param'){drag.type='wlshift';drag.x00=o.x0;drag.f0=conv(P,o.frame,[pt.x,pt.t]);}
        else drag.type='none';}
      else drag.type=tool==='event'?'addEvent':'pan';
    }else if(tool==='wl'){const ne=nearestEvent(P,pt.px,pt.py);const a=ne?ne.q:[snap(pt.x,ev.shiftKey),snap(pt.t,ev.shiftKey)];drag.type='drawWl';preview={P,type:'wl',a,b:a};}
    else if(tool==='rod'){const a=[snap(pt.x,ev.shiftKey),snap(pt.t,ev.shiftKey)];drag.type='drawRod';preview={P,type:'rod',a,b:a};}
    else if(tool==='connect'){drag.type='none';if(role==='event')connectClick(id);}
    render();
  });
  svg.addEventListener('pointermove',ev=>{
    if(!pointers.has(ev.pointerId)||!drag)return;
    pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    const g=geom[P];
    if(drag.type==='pinch'){if(pointers.size<2)return;const[a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const mid=[(a.x+b.x)/2,(a.y+b.y)/2];
      const r=svg.getBoundingClientRect();const mx=mid[0]-r.left,my=mid[1]-r.top;const s0=g.s;const wx=S.view.cx+(mx-g.w/2)/s0,wt=S.view.ct-(my-g.h/2)/s0;
      S.view.span=Math.max(0.5,Math.min(400,drag.span*drag.dist/d));const s1=Math.min(g.w,g.h)/S.view.span;
      const pmx=drag.mid[0]-r.left,pmy=drag.mid[1]-r.top;S.view.cx=wx-(mx-g.w/2)/s1-(mx-pmx)/s1;S.view.ct=wt+(my-g.h/2)/s1+(my-pmy)/s1;drag.mid=mid;render();return;}
    if(!drag.moved&&Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)<4)return;
    drag.moved=true;const pt=ptOf(P,ev),free=ev.shiftKey;const o=drag.id!=null?byId(drag.id):null;
    switch(drag.type){
      case'pan':case'addEvent':S.view.cx-=(ev.clientX-drag.lx)/g.s;S.view.ct+=(ev.clientY-drag.ly)/g.s;drag.type='pan';break;
      case'event':{beginLive();const q=conv(P,o.home,[snap(pt.x,free),snap(pt.t,free)]);o.x=q[0];o.t=q[1];break;}
      case'rodend':{beginLive();const end=o.ends[drag.i];if(end.wl!=null){end.wl=null;toast('Rod end detached from its worldline.');}end.x=snap(conv(P,o.frame,[pt.x,pt.t])[0],free);break;}
      case'rodT':{beginLive();o.T=snap(conv(P,o.frame,[pt.x,pt.t])[1],free);break;}
      case'wlshift':{beginLive();const f1=conv(P,o.frame,[pt.x,pt.t]);o.x0=snap(drag.x00+(f1[0]-drag.f0[0])-o.u*(f1[1]-drag.f0[1]),free);break;}
      case'drawWl':{const ne=nearestEvent(P,pt.px,pt.py);preview.b=ne?ne.q:[snap(pt.x,free),snap(pt.t,free)];break;}
      case'drawRod':preview.b=[snap(pt.x,free),preview.a[1]];break;
    }
    drag.lx=ev.clientX;drag.ly=ev.clientY;render();
  });
  const up=(ev,cancel)=>{
    if(!pointers.has(ev.pointerId))return;pointers.delete(ev.pointerId);
    if(!drag){return;}
    if(drag.type==='pinch'){if(pointers.size===0)drag=null;else drag={type:'none'};return;}
    const d=drag;drag=null;endLive();
    if(cancel){preview=null;render();return;}
    if(d.type==='pan'&&!d.moved&&d.id==null)sel=null;
    if(d.type==='addEvent'&&!d.moved){checkpoint();newEvent(P,snap(d.pt0.x,ev.shiftKey),snap(d.pt0.t,ev.shiftKey));}
    if(d.type==='drawWl'){const a=preview.a,b=preview.b;preview=null;const dx=b[0]-a[0],dt=b[1]-a[1];
      if(Math.hypot(dx,dt)<0.05)toast('Drag to draw a worldline: its slope sets the velocity.');
      else{let u=Math.abs(dt)<1e-9?Math.sign(dx):dx/dt;if(Math.abs(u)>1){u=Math.sign(u);toast('Capped at the speed of light. Use the Rod tool for a spacelike line.');}checkpoint();newParamWl(P,u,a[0]-u*a[1]);}}
    if(d.type==='drawRod'){const a=preview.a,b=preview.b;preview=null;
      if(Math.abs(b[0]-a[0])<0.05)toast('Drag sideways to lay a rod along a line of simultaneity.');
      else{checkpoint();const r=newRod(P,a[1],a[0],b[0]);const att=[];[a,b].forEach((p,i)=>{const[px,py]=toPx(P,p);const w=nearestCut(P,P,a[1],px,py);if(w){r.ends[i].wl=w.id;att.push(w.label||'a worldline');}});if(att.length)toast(`Rod end${att.length>1?'s':''} attached to ${att.join(' and ')}.`);}}
    render();
  };
  svg.addEventListener('pointerup',ev=>up(ev,false));
  svg.addEventListener('pointercancel',ev=>up(ev,true));
  svg.addEventListener('wheel',ev=>{
    ev.preventDefault();const g=geom[P];if(!g)return;const pt=ptOf(P,ev);
    S.view.span=Math.max(0.5,Math.min(400,S.view.span*Math.exp(ev.deltaY*(ev.deltaMode?0.05:0.0015))));
    const s1=Math.min(g.w,g.h)/S.view.span;S.view.cx=pt.x-(pt.px-g.w/2)/s1;S.view.ct=pt.t+(pt.py-g.h/2)/s1;render();
  },{passive:false});
}
function connectClick(id){
  if(connectIds[connectIds.length-1]===id)return;
  if(connectIds.length){const a=evK(byId(connectIds[connectIds.length-1])),b=evK(byId(id));const d=[b[0]-a[0],b[1]-a[1]];
    if(isSpacelike(d)){toast(`${byId(connectIds.at(-1)).label} → ${byId(id).label} is spacelike, so no worldline can join them. Use a rod instead.`);return;}}
  connectIds.push(id);
}
function finishConnect(){
  if(connectIds.length<2){toast('Click at least two events.');return;}
  checkpoint();addObj({kind:'wl',mode:'chain',ids:connectIds.slice(),extend:false,color:nextColor(),label:nextLabel('wl'),showEq:false});
  connectIds=[];render();
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',ev=>{
  const inField=ev.target.closest&&ev.target.closest('input,select,textarea');
  if(ev.ctrlKey||ev.metaKey){if(inField)return;const k=ev.key.toLowerCase();
    if(k==='z'&&!ev.shiftKey){undo();ev.preventDefault();}else if(k==='y'||(k==='z'&&ev.shiftKey)){redo();ev.preventDefault();}return;}
  if(inField){if(ev.key==='Enter'&&ev.target.tagName==='INPUT')ev.target.blur();return;}
  const map={v:'select',e:'event',w:'wl',r:'rod',j:'connect'};
  if(map[ev.key.toLowerCase()]&&!ev.altKey){setTool(map[ev.key.toLowerCase()]);return;}
  if(ev.key==='Delete'||ev.key==='Backspace'){if(sel!=null){deleteObj(sel);ev.preventDefault();}return;}
  if(ev.key==='Escape'){if(connectIds.length)connectIds=[];else sel=null;render();return;}
  if(ev.key==='Enter'&&tool==='connect'){finishConnect();return;}
  const arrows={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]};
  if(arrows[ev.key]&&sel!=null){const o=byId(sel);if(o&&o.kind==='event'){ev.preventDefault();checkpoint();const st=ev.shiftKey?1:0.1;o.x=+(o.x+arrows[ev.key][0]*st).toFixed(6);o.t=+(o.t+arrows[ev.key][1]*st).toFixed(6);render();}}
});

/* ---------- status, toast, render ---------- */
const TOOLHELP={
  select:'<b>Move:</b> drag events, rod ends, rods (changes their time) or worldlines. Drag empty space to pan; scroll or pinch to zoom.',
  event:'<b>Event:</b> click either diagram to add an event. It snaps to 0.1; hold Shift to place it freely.',
  wl:'<b>Worldline:</b> drag from a point or an event. The slope sets the velocity, capped at the speed of light.',
  rod:'<b>Rod:</b> drag sideways to lay a measuring rod along a line of simultaneity in that panel’s frame. Release near a worldline to attach the end to it.',
  connect:'<b>Join events:</b> click events in order, then press Finish (or Enter).'
};
let lastStatus='';
function renderStatus(){
  let h=TOOLHELP[tool];
  if(tool==='connect')h+=` <span>${connectIds.length?connectIds.map(i=>esc(byId(i)?.label||'?')).join(' → '):'(no events picked yet)'}</span> <button data-sact="finish" ${connectIds.length<2?'disabled':''}>Finish</button> <button data-sact="cancel" ${connectIds.length?'':'disabled'}>Clear</button>`;
  if(h!==lastStatus){$('status').innerHTML=h;lastStatus=h;}
}
$('status').addEventListener('click',ev=>{const b=ev.target.closest('[data-sact]');if(!b)return;if(b.dataset.sact==='finish')finishConnect();else{connectIds=[];render();}});
let toastTimer=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),3800);}
let raf=0,saveTimer=0;
function render(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;doRender();});}
function doRender(){
  $('figKp').hidden=!S.showKp;document.querySelector('.panels').classList.toggle('single',!S.showKp);
  $('showKp').checked=S.showKp;$('showKpname').textContent=S.names.Kp;
  visibleFrames().forEach(drawPanel);renderSidebar();renderStatus();
  const setIf=(el,v)=>{if(document.activeElement!==el)el.value=v;};
  setIf($('vNum'),fmtIn(S.v));setIf($('vRange'),S.v);setIf($('gNum'),fmtIn(gam(S.v)));
  $('gridK').checked=S.grid.K;$('gridKp').checked=S.grid.Kp;
  $('gridKname').textContent=S.names.K;$('gridKpname').textContent=S.names.Kp;$('capK').textContent=S.names.K;$('capKp').textContent=S.names.Kp;
  document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===tool));
  $('bUndo').disabled=!undoStack.length;$('bRedo').disabled=!redoStack.length;
  const empty=!S.objs.length;for(const P of FR){const hEl=$('hint'+P);hEl.style.display=empty?'':'none';hEl.textContent=tool==='event'?'Click to add an event':'Pick the Event tool (E), then click here to add an event';}
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}},400);
}
new ResizeObserver(render).observe(document.querySelector('.panels'));

/* ---------- load ---------- */
(function load(){
  const m=location.hash.match(/^#s=(.+)$/);
  if(m){try{S=normalize(dec(m[1]));history.replaceState(null,'',location.pathname+location.search);toast('Loaded the shared diagram.');}catch(e){toast('That link’s diagram could not be read.');}}
  else{try{const raw=localStorage.getItem(STORE_KEY);if(raw)S=normalize(JSON.parse(raw));}catch(e){}}
  render();
})();
</script>
</body>
</html>
